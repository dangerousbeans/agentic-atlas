slug: human-in-the-loop
name: Human-in-the-Loop
family: safety-oversight
aliases: [Approval gate, Interrupt/resume, HITL]
summary: Pause before high-stakes or irreversible actions so a person can approve, edit or reject; then resume.
badges: { autonomy: low, cost: low, latency: high }
sources:
  - title: A practical guide to building agents (OpenAI, 2025)
    url: https://cdn.openai.com/business-guides-and-resources/a-practical-guide-to-building-agents.pdf
  - title: Interrupts (LangGraph docs)
    url: https://docs.langchain.com/oss/python/langgraph/interrupts
related:
  composesWith: [guardrails, supervisor]
  confusedWith: []
code:
  - id: gate
    title: human_in_the_loop.py
    lang: python
    source: |
      def run_with_approval(task, agent, tools):
          action = agent.next_action(task)
          if risk(action) == "high":
              decision = interrupt({"action": action})  # pause here; state is saved
              if decision.kind == "reject":
                  return agent.replan(task, reason=decision.reason)
              if decision.kind == "edit":
                  action = decision.edited_action
          return tools.execute(action)
prompts:
  - id: approval
    title: Approval request message
    lang: markdown
    source: |
      **{{agent_name}} wants to take an action that needs your approval.**

      Action: `{{tool_name}}`
      Arguments: {{arguments}}
      Why: {{rationale}}
      Effect if approved: {{effect}}
      Reversible: {{reversible}}

      Reply with one of: approve, edit (give the changed arguments), reject (give a reason).
  - id: risk
    title: Risk classifier prompt
    lang: markdown
    source: |
      Classify the risk of this proposed tool call.

      <tool>{{tool_name}}</tool>
      <arguments>{{arguments}}</arguments>

      High risk means it is irreversible, moves money, sends messages to people
      outside the company, or changes production data. Otherwise it is low.
      Respond in JSON: {"risk": "high" | "low", "reason": "one sentence"}
diagram:
  nodes:
    - { id: user, kind: io, label: Task }
    - { id: agent, kind: agent, label: Agent }
    - { id: risk, kind: router, label: Risk check }
    - { id: human, kind: human, label: Reviewer }
    - { id: tool, kind: tool, label: Refund API }
    - { id: out, kind: io, label: Done }
  edges:
    - { id: task, from: user, to: agent }
    - { id: propose, from: agent, to: risk }
    - { id: high, from: risk, to: human, label: high risk }
    - { id: low, from: risk, to: tool, label: low risk }
    - { id: approve, from: human, to: tool, label: approve }
    - { id: reject, from: human, to: agent, style: dashed, label: reject }
    - { id: result, from: tool, to: out }
  scenarios:
    - id: approve
      label: High risk, approved
      steps:
        - id: propose
          caption: The agent decides to refund a customer $480 and proposes the call.
          duration: 2200
          codeRef: { block: gate, lines: "1-2" }
          events:
            - { type: send, edge: task, token: { kind: prompt, label: refund $480 }, at: [0, 0.4] }
            - { type: activate, node: agent, status: thinking, at: [0.4, 0.7] }
            - { type: send, edge: propose, token: { kind: tool-call, label: refund }, at: [0.7, 1] }
        - id: gate
          caption: The risk check marks a large refund as high risk and routes it to a person.
          duration: 2000
          codeRef: { block: gate, lines: "3" }
          events:
            - { type: branch, node: risk, taken: high, notTaken: [low], at: [0, 0.4] }
            - { type: send, edge: high, token: { kind: tool-call, label: refund }, at: [0.4, 1] }
        - id: wait
          caption: The run pauses. The reviewer sees the action, its reason and its effect, and nothing executes meanwhile.
          duration: 3200
          codeRef: { block: gate, lines: "4" }
          events:
            - { type: activate, node: human, status: waiting }
        - id: approved
          caption: The reviewer approves, so the run resumes and the refund is issued.
          duration: 2600
          codeRef: { block: gate, lines: "9" }
          events:
            - { type: send, edge: approve, token: { kind: result, label: approved }, at: [0, 0.4] }
            - { type: activate, node: tool, status: calling, at: [0.4, 0.7] }
            - { type: send, edge: result, token: { kind: result, label: refund sent }, at: [0.7, 1] }
    - id: reject
      label: High risk, rejected
      steps:
        - id: propose
          caption: The agent proposes deleting a customer's account data.
          duration: 2200
          codeRef: { block: gate, lines: "1-2" }
          events:
            - { type: send, edge: task, token: { kind: prompt, label: clean up }, at: [0, 0.4] }
            - { type: activate, node: agent, status: thinking, at: [0.4, 0.7] }
            - { type: send, edge: propose, token: { kind: tool-call, label: delete }, at: [0.7, 1] }
        - id: gate
          caption: The risk check flags an irreversible delete and routes it to a person.
          duration: 2000
          codeRef: { block: gate, lines: "3" }
          events:
            - { type: branch, node: risk, taken: high, notTaken: [low], at: [0, 0.4] }
            - { type: send, edge: high, token: { kind: tool-call, label: delete }, at: [0.4, 1] }
        - id: wait
          caption: The run pauses while the reviewer reads the request.
          duration: 3200
          codeRef: { block: gate, lines: "4" }
          events:
            - { type: activate, node: human, status: waiting }
        - id: rejected
          caption: The reviewer rejects it with a reason, and the agent must replan instead of acting.
          duration: 2600
          codeRef: { block: gate, lines: "5-6" }
          events:
            - { type: send, edge: reject, token: { kind: feedback, label: not allowed }, at: [0, 0.6] }
            - { type: activate, node: agent, status: thinking, at: [0.6, 1] }
    - id: low-risk
      label: Low risk, no pause
      steps:
        - id: propose
          caption: The agent proposes a harmless lookup.
          duration: 2200
          codeRef: { block: gate, lines: "1-2" }
          events:
            - { type: send, edge: task, token: { kind: prompt, label: check order }, at: [0, 0.4] }
            - { type: activate, node: agent, status: thinking, at: [0.4, 0.7] }
            - { type: send, edge: propose, token: { kind: tool-call, label: lookup }, at: [0.7, 1] }
        - id: skip
          caption: The risk check rates it low and sends it straight to the tool, so the reviewer is never bothered.
          duration: 2200
          codeRef: { block: gate, lines: "9" }
          events:
            - { type: branch, node: risk, taken: low, notTaken: [high], at: [0, 0.4] }
            - { type: send, edge: low, token: { kind: tool-call, label: lookup }, at: [0.4, 1] }
        - id: run
          caption: The tool runs and the result is returned.
          duration: 1800
          codeRef: { block: gate, lines: "9" }
          events:
            - { type: activate, node: tool, status: calling, at: [0, 0.5] }
            - { type: send, edge: result, token: { kind: result, label: status }, at: [0.5, 1] }
