slug: routing
name: Routing
family: workflows
aliases: [Classifier/dispatcher, Intent routing, Triage]
summary: Classify the input, then send it to a specialized prompt, model or tool.
badges: { autonomy: low, cost: low, latency: low }
sources:
  - title: Building effective agents (Anthropic, 2024)
    url: https://www.anthropic.com/engineering/building-effective-agents
related:
  composesWith: [evaluator-optimizer, orchestrator-workers]
  confusedWith: []
code:
  - id: router
    title: routing.py
    lang: python
    source: |
      HANDLERS = {"billing": BILLING, "tech": TECH, "general": GENERAL}

      def route(request):
          label = llm(CLASSIFIER_PROMPT, request=request).label
          handler = HANDLERS.get(label, HANDLERS["general"])
          return llm(handler.prompt, request=request, tools=handler.tools)
prompts:
  - id: classifier
    title: Classifier prompt
    lang: markdown
    source: |
      Classify the customer message into exactly one category:

      - billing: charges, invoices, refunds, plan changes
      - tech: errors, crashes, bugs, how-to questions about the product
      - general: anything else

      <message>{{request}}</message>

      Respond in JSON: {"label": "billing" | "tech" | "general"}
      If the message fits no category clearly, answer "general".
  - id: tech-handler
    title: Tech-support handler prompt
    lang: markdown
    source: |
      You are a support engineer for {{product}}. You can search the
      knowledge base and read the customer's recent error logs.

      <message>{{request}}</message>

      Diagnose the problem, give numbered steps to fix it, and say what
      to send us if the steps do not work.
diagram:
  nodes:
    - { id: input, kind: io, label: Request, description: "The incoming customer message, such as 'The app crashes on login' or 'I was charged twice'." }
    - { id: router, kind: router, label: Classifier, description: "Classifies the message into exactly one category (billing, tech or general) and returns it as JSON." }
    - { id: billing, kind: llm, label: Billing, description: "Specialist prompt for charges, invoices, refunds and plan changes, with account context." }
    - { id: tech, kind: llm, label: Tech support, description: "Specialist prompt for errors, crashes and how-to questions, with knowledge-base search and error-log tools." }
    - { id: general, kind: llm, label: General, description: "Fallback handler for anything the classifier does not clearly place as billing or tech." }
    - { id: output, kind: io, label: Reply, description: "The reply written by whichever specialist handled the message." }
  edges:
    - { id: in, from: input, to: router, description: "The raw customer message is placed in the classifier prompt.", example: "Classify the customer message into exactly one category. <message>The app crashes on login</message>" }
    - { id: to-billing, from: router, to: billing, description: "Taken when the label is billing; the original message goes to the billing prompt.", example: "I was charged twice for my March invoice" }
    - { id: to-tech, from: router, to: tech, description: "Taken when the label is tech; the original message goes to the tech-support prompt.", example: "The app crashes on login" }
    - { id: to-general, from: router, to: general, description: "Taken for any other or unclear label; the message goes to the general handler.", example: "Do you have an office in Berlin?" }
    - { id: billing-out, from: billing, to: output, description: "The billing specialist's reply goes back to the customer.", example: "Sorry about that. I can see two charges of $29 on March 3. I've flagged the duplicate charge for a refund; you'll hear from us within 3 days." }
    - { id: tech-out, from: tech, to: output, description: "The tech-support reply goes back to the customer.", example: "1. Update to version 4.2.1. 2. Clear the app cache. 3. Log in again. If it still crashes, send us the log from Settings > Help." }
    - { id: general-out, from: general, to: output, description: "The general handler's reply goes back to the customer.", example: "Thanks for reaching out. We are a fully remote team, so we do not have a Berlin office, but you can book a call at any time." }
  scenarios:
    - id: tech
      label: '"The app crashes on login"'
      steps:
        - { id: arrive, caption: A customer message arrives at the classifier., duration: 1000, codeRef: { block: router, lines: "3" }, events: [{ type: send, edge: in, token: { kind: prompt, label: crash? } }] }
        - id: classify
          caption: The classifier labels it a technical issue; the other routes go dark.
          duration: 1400
          codeRef: { block: router, lines: "4-5" }
          events:
            - { type: branch, node: router, taken: to-tech, notTaken: [to-billing, to-general], at: [0, 0.5] }
            - { type: send, edge: to-tech, token: { kind: prompt }, at: [0.5, 1] }
        - id: handle
          caption: The tech-support prompt, with its own tools and instructions, writes the reply.
          duration: 1800
          codeRef: { block: router, lines: "6" }
          events:
            - { type: activate, node: tech, status: thinking, at: [0, 0.5] }
            - { type: send, edge: tech-out, token: { kind: result, label: reply }, at: [0.5, 1] }
    - id: billing
      label: '"I was charged twice"'
      steps:
        - { id: arrive, caption: A customer message arrives at the classifier., duration: 1000, codeRef: { block: router, lines: "3" }, events: [{ type: send, edge: in, token: { kind: prompt, label: refund? } }] }
        - id: classify
          caption: The classifier labels it a billing question.
          duration: 1400
          codeRef: { block: router, lines: "4-5" }
          events:
            - { type: branch, node: router, taken: to-billing, notTaken: [to-tech, to-general], at: [0, 0.5] }
            - { type: send, edge: to-billing, token: { kind: prompt }, at: [0.5, 1] }
        - id: handle
          caption: The billing specialist answers using account context.
          duration: 1800
          codeRef: { block: router, lines: "6" }
          events:
            - { type: activate, node: billing, status: thinking, at: [0, 0.5] }
            - { type: send, edge: billing-out, token: { kind: result, label: reply }, at: [0.5, 1] }
