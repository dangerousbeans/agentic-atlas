slug: orchestrator-workers
name: Orchestrator-Workers
family: workflows
aliases: [Dynamic decomposition, Planner-workers]
summary: A central LLM works out the subtasks at run time, sends them to worker LLMs, then combines the results.
badges: { autonomy: medium, cost: high, latency: medium }
sources:
  - title: Building effective agents (Anthropic, 2024)
    url: https://www.anthropic.com/engineering/building-effective-agents
related:
  composesWith: [evaluator-optimizer]
  confusedWith:
    - { slug: routing, difference: "Routing picks one fixed path; the orchestrator invents the subtasks at run time and uses several workers." }
code:
  - id: orchestrator
    title: orchestrator_workers.py
    lang: python
    source: |
      def orchestrator_workers(task):
          subtasks = llm(PLANNER_PROMPT, task=task).subtasks  # decided at run time
          results = parallel(llm(WORKER_PROMPT, subtask=s) for s in subtasks)
          return llm(SYNTHESIS_PROMPT, task=task, results=results)
prompts:
  - id: planner
    title: Orchestrator planning prompt
    lang: markdown
    source: |
      Break the task below into independent subtasks, one per file or
      source that needs separate work. Do not invent work the task does
      not need.

      <task>{{task}}</task>

      Respond in JSON:
      {"subtasks": [{"target": "...", "instruction": "self-contained instructions"}]}
  - id: worker
    title: Worker prompt
    lang: markdown
    source: |
      You are handling one part of a larger task. Do only this part.

      <target>{{subtask.target}}</target>
      <instruction>{{subtask.instruction}}</instruction>

      Return the finished change and a one-line note on anything you
      could not do.
  - id: synthesis
    title: Synthesis prompt
    lang: markdown
    source: |
      Combine the worker results into one coherent answer for the task.
      Flag any conflicts between workers and resolve them.

      <task>{{task}}</task>
      <results>{{results}}</results>
diagram:
  nodes:
    - { id: input, kind: io, label: Task, description: "The overall job, such as 'Rename the API across the repo', with no subtasks defined yet." }
    - { id: orchestrator, kind: llm, label: Orchestrator, description: "Plans the subtasks at run time, dispatches them to workers, then combines their results into one answer." }
    - { id: w1, kind: llm, label: Worker 1, hidden: true, description: "Worker created for one subtask, here editing a.ts, doing only its assigned part." }
    - { id: w2, kind: llm, label: Worker 2, hidden: true, description: "Worker created for the second subtask, here editing b.ts, working independently of the others." }
    - { id: w3, kind: llm, label: Worker 3, hidden: true, description: "Worker created for the third subtask, here editing c.ts; the number of workers depends on the task." }
    - { id: output, kind: io, label: Result, description: "The combined result, such as one diff covering all three files with conflicts resolved." }
  edges:
    - { id: task, from: input, to: orchestrator, description: "The task goes to the orchestrator, which has to work out the steps itself.", example: "Rename getUser to fetchUser everywhere in the repo, including callers and tests." }
    - { id: d1, from: orchestrator, to: w1, description: "A self-contained instruction for worker 1, created by the orchestrator's plan.", example: "{\"target\": \"a.ts\", \"instruction\": \"Rename getUser to fetchUser and update its two call sites.\"}" }
    - { id: d2, from: orchestrator, to: w2, description: "A self-contained instruction for worker 2, sent in parallel with the others.", example: "{\"target\": \"b.ts\", \"instruction\": \"Rename the getUser import and its three usages to fetchUser.\"}" }
    - { id: d3, from: orchestrator, to: w3, description: "A self-contained instruction for worker 3, sent in parallel with the others.", example: "{\"target\": \"c.ts\", \"instruction\": \"Update the getUser mock and assertions in the tests to fetchUser.\"}" }
    - { id: r1, from: w1, to: orchestrator, style: dashed, description: "Worker 1's finished change and note go back to the orchestrator.", example: "Renamed getUser to fetchUser in a.ts (def + 2 call sites). Nothing left undone." }
    - { id: r2, from: w2, to: orchestrator, style: dashed, description: "Worker 2's finished change and note go back to the orchestrator.", example: "Updated the import and 3 usages in b.ts. Nothing left undone." }
    - { id: r3, from: w3, to: orchestrator, style: dashed, description: "Worker 3's finished change and note go back to the orchestrator.", example: "Updated mock and assertions in c.ts. Note: one snapshot test still references the old name." }
    - { id: done, from: orchestrator, to: output, description: "The orchestrator's synthesis becomes the final result, with worker conflicts flagged and resolved.", example: "Combined diff: a.ts, b.ts, c.ts renamed to fetchUser. Flagged: a snapshot test still uses the old name." }
  scenarios:
    - id: three-files
      label: '"Rename the API across the repo"'
      steps:
        - { id: arrive, caption: The task reaches the orchestrator., duration: 1000, codeRef: { block: orchestrator, lines: "1" }, events: [{ type: send, edge: task, token: { kind: prompt, label: task } }] }
        - id: plan
          caption: The orchestrator decides at run time that three files need changes, and spins up a worker for each.
          duration: 2000
          codeRef: { block: orchestrator, lines: "2" }
          events:
            - { type: activate, node: orchestrator, status: thinking, at: [0, 0.5] }
            - { type: appear, node: w1, at: [0.5, 0.65] }
            - { type: appear, node: w2, at: [0.6, 0.75] }
            - { type: appear, node: w3, at: [0.7, 0.85] }
        - id: dispatch
          caption: Each worker gets its own subtask in parallel.
          duration: 1400
          codeRef: { block: orchestrator, lines: "3" }
          events:
            - { type: send, edge: d1, token: { kind: prompt, label: a.ts } }
            - { type: send, edge: d2, token: { kind: prompt, label: b.ts } }
            - { type: send, edge: d3, token: { kind: prompt, label: c.ts } }
        - id: work
          caption: Workers finish at different times and report back.
          duration: 2400
          codeRef: { block: orchestrator, lines: "3" }
          events:
            - { type: activate, node: w1, status: thinking, at: [0, 0.4] }
            - { type: activate, node: w2, status: thinking, at: [0, 0.6] }
            - { type: activate, node: w3, status: thinking, at: [0, 0.75] }
            - { type: send, edge: r1, token: { kind: result }, at: [0.4, 0.65] }
            - { type: send, edge: r2, token: { kind: result }, at: [0.6, 0.85] }
            - { type: send, edge: r3, token: { kind: result }, at: [0.75, 1] }
        - id: synthesize
          caption: The orchestrator combines the results into one answer.
          duration: 1800
          codeRef: { block: orchestrator, lines: "4" }
          events:
            - { type: activate, node: orchestrator, status: thinking, at: [0, 0.5] }
            - { type: send, edge: done, token: { kind: result, label: diff }, at: [0.5, 1] }
