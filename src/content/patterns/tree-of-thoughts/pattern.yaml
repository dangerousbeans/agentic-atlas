slug: tree-of-thoughts
name: Tree of Thoughts
family: planning-search
aliases: [ToT, Deliberate search]
summary: Generate several candidate thoughts at each step, score them, expand the promising branches and backtrack at dead ends.
badges: { autonomy: medium, cost: high, latency: high }
sources:
  - title: "Tree of Thoughts: Deliberate Problem Solving with Large Language Models (Yao et al., 2023)"
    url: https://arxiv.org/abs/2305.10601
related:
  composesWith: [reflexion]
  confusedWith:
    - { slug: react, difference: "ReAct commits to one line of thought and acts on it; Tree of Thoughts holds several candidate lines at once, scores them, and abandons the ones that look hopeless." }
    - { slug: graph-of-thoughts, difference: "Graph of Thoughts can also merge several thoughts into one and loop on a single thought to refine it. Tree of Thoughts only branches and prunes, so every thought has one parent." }
    - { slug: lats, difference: "LATS runs each candidate action in a real environment and backs the observed score up the tree. Tree of Thoughts searches over thoughts the model only imagines, and the model scores them itself." }
    - { slug: chain-of-thought, difference: "Chain-of-thought follows one line of reasoning in one call. Tree of Thoughts holds several candidate steps, scores them over many calls, and backtracks from dead ends." }
origin:
  by: Shunyu Yao et al.
  org: Princeton University, Google DeepMind
  year: 2023
  url: https://arxiv.org/abs/2305.10601
  kind: introduced
  note: "NeurIPS 2023. Jieyi Long's 'Large Language Model Guided Tree-of-Thought' (https://arxiv.org/abs/2305.08291) appeared concurrently, the same month."
build:
  goal: "Solve a problem by depth-first search over partial solutions: propose several next thoughts, rate each, expand the most promising, and backtrack when a branch dead-ends."
  steps:
    - "Represent a state as the problem plus the list of thoughts taken so far; push the empty state onto a stack."
    - "Pop the top state. If a deterministic check says it solves the problem, return its thoughts as the solution."
    - "If the state is below the depth limit, call the model with the {{prompt:propose}}, passing the problem and the state, and parse up to breadth distinct candidate thoughts."
    - "Rate each candidate with the {{prompt:value}} and read the first word as sure, maybe or impossible."
    - "Drop the impossible candidates, and push the rest onto the stack so the best-rated is popped next (sure before maybe)."
    - "When a state has no surviving children or is at the depth limit, do nothing more with it; popping the next state is the backtrack to its parent's next-best sibling."
  stop: "Stop when a state passes the solution check, when the stack is empty, or after 100 model calls. If no solution is found, return the deepest state reached with a status saying the search failed."
  requirements:
    - "Make the breadth (default 3), the depth limit (default 3) and the total model-call budget (default 100) parameters."
    - "If a rating reply does not start with sure, maybe or impossible, treat it as maybe: never prune a branch on a parse failure."
    - "Drop proposed thoughts that duplicate a sibling or a state already visited, so the breadth is not wasted."
    - "Use a deterministic solution check (here, evaluate the arithmetic) wherever the task allows, instead of asking the model."
    - "Add a Game of 24 test with a stub LLM rating 10-4=6 sure, 4+9=13 and 13*4=52 impossible, then 6+9=15 sure, 13-9=4 maybe, and every child of 6+9=15 impossible; assert 4 proposal calls and the path 10-4=6, 13-9=4, 6*4=24."
defaultVariantName: Depth-first
prompts:
  - id: propose
    title: Thought proposal prompt
    lang: markdown
    source: |
      Problem: {{problem}}

      Progress so far:
      {{state}}

      Propose {{breadth}} different next steps. Each must be a single, concrete
      move that follows from the progress above, and they must not duplicate
      each other. Label them A, B, C.
  - id: value
    title: Thought evaluation prompt
    lang: markdown
    source: |
      Problem: {{problem}}

      Candidate progress:
      {{thought}}

      Can this candidate still lead to a full solution? Check it carefully
      against the problem's constraints.

      Answer with exactly one word: sure, maybe or impossible.
      Then give one sentence of reasoning.
diagram:
  nodes:
    - id: problem
      kind: io
      label: Problem
      description: "The puzzle to solve: make 24 from 4, 9, 10 and 13 using + - * /."
    - id: t1
      kind: llm
      label: Thought 1
      description: "First candidate move, 4+9=13, proposed alongside two alternatives."
    - id: t2
      kind: llm
      label: Thought 2
      description: "Second candidate move, 10-4=6, which the evaluator rates promising and the search expands."
    - id: t3
      kind: llm
      label: Thought 3
      description: "Third candidate move, 13*4=52, which looks too large to reach 24 and gets pruned."
    - id: t2a
      kind: llm
      label: Thought 2a
      hidden: true
      description: "A follow-up from Thought 2, 6+9=15; the search tries it first, but every continuation fails."
    - id: t2b
      kind: llm
      label: Thought 2b
      hidden: true
      description: "A follow-up from Thought 2, 13-9=4, leaving 6 and 4; the search backtracks here and finds 6*4=24."
    - id: evaluator
      kind: evaluator
      label: Evaluator
      description: "Rates each candidate sure, maybe or impossible so the search can expand good branches and prune dead ends."
    - id: out
      kind: io
      label: Solution
      description: "The finished path of moves that reaches 24, returned once a branch solves the puzzle."
  edges:
    - id: p1
      from: problem
      to: t1
      description: "The proposal prompt yields a first candidate move from the starting numbers."
      example: "Propose 3 different next steps. A: 4+9=13 (left: 13, 10, 13)"
    - id: p2
      from: problem
      to: t2
      description: "The same prompt yields a second, different candidate, so the model does not commit to one line."
      example: "B: 10-4=6 (left: 6, 9, 13)"
    - id: p3
      from: problem
      to: t3
      description: "A third distinct candidate rounds out the breadth of three."
      example: "C: 13*4=52 (left: 52, 9, 10)"
    - id: g1
      from: t2
      to: t2a
      label: expand
      description: "The promising Thought 2 is expanded with a new proposal prompt; this is one follow-up."
      example: "Progress: 10-4=6 (left: 6, 9, 13). Next step A: 6+9=15 (left: 15, 13)"
    - id: g2
      from: t2
      to: t2b
      label: expand
      description: "A second follow-up from Thought 2, a different next move."
      example: "Next step B: 13-9=4 (left: 6, 4)"
    - id: s1
      from: t1
      to: evaluator
      style: dashed
      label: "rate?"
      description: "Thought 1 is sent to the evaluator to ask whether it can still reach 24."
      example: "Candidate progress: 4+9=13 (left: 13, 10, 13). Answer sure, maybe or impossible."
    - id: s2
      from: t2
      to: evaluator
      style: dashed
      label: "rate?"
      description: "Thought 2 is sent to the evaluator for a rating."
      example: "Candidate progress: 10-4=6 (left: 6, 9, 13). Answer sure, maybe or impossible."
    - id: s3
      from: t3
      to: evaluator
      style: dashed
      label: "rate?"
      description: "Thought 3 is sent to the evaluator for a rating."
      example: "Candidate progress: 13*4=52 (left: 52, 9, 10). Answer sure, maybe or impossible."
    - id: s4
      from: t2a
      to: evaluator
      style: dashed
      label: "rate?"
      description: "The follow-up Thought 2a is rated before the search explores it."
      example: "Candidate progress: 10-4=6, 6+9=15 (left: 15, 13). Answer sure, maybe or impossible."
    - id: s5
      from: t2b
      to: evaluator
      style: dashed
      label: "rate?"
      description: "The follow-up Thought 2b is rated before the search explores it."
      example: "Candidate progress: 10-4=6, 13-9=4 (left: 6, 4). Answer sure, maybe or impossible."
    - id: solved
      from: t2b
      to: out
      label: solved
      description: "The last move from Thought 2b makes 24, so the whole path is returned as the solution."
      example: "10-4=6; 13-9=4; 6*4=24"
  scenarios:
    - id: game-of-24
      label: '"Make 24 from 4, 9, 10, 13"'
      steps:
        - id: propose
          caption: The model proposes three different first moves instead of committing to one.
          duration: 2400
          events:
            - { type: send, edge: p1, token: { kind: prompt, label: 4+9=13 }, at: [0, 0.6] }
            - { type: send, edge: p2, token: { kind: prompt, label: 10-4=6 }, at: [0.15, 0.75] }
            - { type: send, edge: p3, token: { kind: prompt, label: 13*4=52 }, at: [0.3, 0.9] }
        - id: score
          caption: The evaluator rates each candidate and judges thoughts 1 and 3 impossible and thought 2 sure.
          duration: 3000
          events:
            - { type: send, edge: s1, token: { kind: prompt, label: "4+9=13" }, at: [0, 0.5] }
            - { type: send, edge: s2, token: { kind: prompt, label: "10-4=6" }, at: [0.2, 0.7] }
            - { type: send, edge: s3, token: { kind: prompt, label: "13*4=52" }, at: [0.4, 0.9] }
            - { type: activate, node: evaluator, status: thinking, at: [0.1, 1] }
        - id: prune
          caption: The impossible branches are pruned and never expanded.
          duration: 1800
          events:
            - { type: branch, node: problem, taken: p2, notTaken: [p1, p3], at: [0, 0.25] }
            - { type: activate, node: t1, status: error, at: [0.25, 0.6] }
            - { type: activate, node: t3, status: error, at: [0.4, 0.8] }
        - id: expand
          caption: The search expands the one promising branch into two follow-up thoughts.
          duration: 2400
          events:
            - { type: activate, node: t2, status: thinking, at: [0, 0.3] }
            - { type: appear, node: t2a, at: [0.3, 0.45] }
            - { type: appear, node: t2b, at: [0.4, 0.55] }
            - { type: send, edge: g1, token: { kind: prompt, label: 6+9=15 }, at: [0.5, 1] }
            - { type: send, edge: g2, token: { kind: prompt, label: 13-9=4 }, at: [0.5, 1] }
        - id: score-children
          caption: Both follow-ups are rated and both look possible, so the search tries 2a first.
          duration: 2600
          events:
            - { type: send, edge: s4, token: { kind: prompt, label: "6+9=15" }, at: [0, 0.5] }
            - { type: send, edge: s5, token: { kind: prompt, label: "13-9=4" }, at: [0.3, 0.8] }
        - id: explore-2a
          caption: The search dives into 2a, but every follow-up from it fails.
          duration: 2200
          events:
            - { type: activate, node: t2a, status: thinking, at: [0, 0.6] }
            - { type: activate, node: t2a, status: error, at: [0.6, 1] }
        - id: backtrack
          caption: The call for 2a returns nothing, so the search backtracks to the parent and tries 2b.
          duration: 2200
          events:
            - { type: branch, node: t2, taken: g2, notTaken: [g1], at: [0, 0.4] }
            - { type: activate, node: t2b, status: thinking, at: [0.4, 1] }
        - id: solved
          caption: The last step, 6 times 4, makes 24, and the finished path is returned.
          duration: 2200
          events:
            - { type: activate, node: t2b, status: thinking, at: [0, 0.4] }
            - { type: send, edge: solved, token: { kind: result, label: 6*4=24 }, at: [0.4, 1] }
variants:
  - id: bfs-beam
    name: Breadth-first beam
    summary: "Expand every state on the frontier together, rate all the children, and keep only the best b for the next level; there is no backtracking."
    build:
      goal: "Solve a problem by breadth-first search with a beam: at each level expand every kept state, rate every child, and keep the best few, for a fixed number of levels."
      steps:
        - "Start the frontier as a list holding one empty state: the problem with no thoughts taken."
        - "For every state on the frontier, call the model with the {{prompt:propose}} and parse up to breadth candidate thoughts, giving the next level's children."
        - "Rate every child with the {{prompt:value}}, mapping sure, maybe and impossible to scores of 20, 1 and 0.001 as the paper does, and summing over the samples if you rate more than once."
        - "Sort the children by score and keep the top beam-width as the new frontier; dropping impossible children outright is a simplification that saves calls."
        - "Repeat for the configured number of levels, then return the best-scoring final state that passes the solution check."
      stop: "Stop after the last level, or earlier if the frontier is empty. If no final state passes the solution check, return the best-scoring one with a status saying it is unverified."
      requirements:
        - "Make the beam width (default 5), the breadth per state (default 5) and the number of levels (default 3) parameters."
        - "Run the proposal and rating calls for one level concurrently, with a cap on calls in flight (default 8)."
        - "If a rating reply does not start with sure, maybe or impossible, score it as maybe; never prune on a parse failure."
        - "Deduplicate children with the same state across the whole level before rating, so the beam is not filled with copies."
        - "Add a test with a stub LLM, beam width 2 and 3 levels; assert 5 proposal calls (1 + 2 + 2), 2 states kept after each of the first two levels, and the exact path 10-4=6, 13-9=4, 6*4=24."
    diagram:
      nodes:
        - id: problem
          kind: io
          label: Problem
          description: "The puzzle to solve: make 24 from 4, 9, 10 and 13 using + - * /."
        - id: proposer
          kind: llm
          label: Proposer
          sublabel: whole frontier
          description: "Proposes several next thoughts for every state on the frontier at once, giving one whole level of children."
        - id: evaluator
          kind: evaluator
          label: Evaluator
          description: "Rates every child sure, maybe or impossible and turns the ratings into scores for ranking."
        - id: beam
          kind: memory
          label: Beam
          sublabel: top b kept
          description: "The frontier: only the top-scoring b states of each level are kept; the rest are discarded for good."
        - id: out
          kind: io
          label: Solution
          description: "The best final state after the last level, checked to make 24."
      edges:
        - id: start
          from: problem
          to: proposer
          description: "The starting numbers form the first, one-state frontier."
          example: "Input: 4 9 10 13"
        - id: children
          from: proposer
          to: evaluator
          label: level
          description: "Every proposed child of every frontier state goes to the evaluator together."
          example: "10-4=6 (left: 6 9 13); 4+9=13 (left: 10 13 13); 13*4=52 (left: 9 10 52); 13-9=4 (left: 4 4 10) ..."
        - id: keep
          from: evaluator
          to: beam
          label: top b
          description: "The children are ranked by score and only the best b are kept as the new frontier."
          example: "Keep: 10-4=6 (sure), 13-9=4 (sure). Drop: 13*4=52 (impossible), 4+9=13 (maybe, ranked lower)."
        - id: next
          from: beam
          to: proposer
          style: loop
          label: next level
          description: "Every state in the beam is expanded at the next level, side by side."
          example: "Frontier: [10-4=6 (left: 6 9 13), 13-9=4 (left: 4 4 10)]"
        - id: finish
          from: beam
          to: out
          label: best
          description: "After the last level, the best-scoring state that passes the check is returned."
          example: "10-4=6; 13-9=4; 6*4=24"
      scenarios:
        - id: game-of-24
          label: '"Make 24 from 4, 9, 10, 13"'
          steps:
            - id: start
              caption: The starting numbers are the only state on the frontier.
              duration: 1000
              events:
                - { type: send, edge: start, token: { kind: prompt, label: 4 9 10 13 } }
            - id: level
              caption: Every frontier state is expanded, every child is rated, and only the best b survive to the next level.
              duration: 3600
              repeat: 2
              events:
                - { type: activate, node: proposer, status: thinking, at: [0, 0.25] }
                - { type: send, edge: children, token: { kind: tokens, label: children }, at: [0.25, 0.45] }
                - { type: activate, node: evaluator, status: thinking, at: [0.45, 0.6] }
                - { type: send, edge: keep, token: { kind: result, label: top b }, at: [0.6, 0.8] }
                - { type: write, node: beam, at: [0.75, 0.85] }
                - { type: send, edge: next, token: { kind: prompt, label: frontier }, at: [0.85, 1] }
            - id: last-level
              caption: At the last level a surviving state makes 24, and it is returned; no branch was ever revisited.
              duration: 3600
              events:
                - { type: activate, node: proposer, status: thinking, at: [0, 0.25] }
                - { type: send, edge: children, token: { kind: tokens, label: children }, at: [0.25, 0.45] }
                - { type: activate, node: evaluator, status: thinking, at: [0.45, 0.6] }
                - { type: send, edge: keep, token: { kind: result, label: top b }, at: [0.6, 0.75] }
                - { type: write, node: beam, at: [0.72, 0.8] }
                - { type: branch, node: beam, taken: finish, notTaken: [next], at: [0.8, 0.85] }
                - { type: send, edge: finish, token: { kind: result, label: 6*4=24 }, at: [0.85, 1] }
