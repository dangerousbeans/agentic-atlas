slug: sectioning
name: "Parallelization: Sectioning"
family: workflows
aliases: [Fan-out/fan-in, Scatter-gather]
summary: Split the work into independent subtasks, run them in parallel, then merge the results.
badges: { autonomy: low, cost: medium, latency: low }
sources:
  - title: Building effective agents (Anthropic, 2024)
    url: https://www.anthropic.com/engineering/building-effective-agents
related:
  composesWith: [prompt-chaining, evaluator-optimizer]
  confusedWith:
    - { slug: orchestrator-workers, difference: "Sectioning splits the work into fixed parts chosen in advance; an orchestrator decides the parts at run time from the input." }
    - { slug: voting, difference: "Sectioning gives each call a different part of the work; voting gives every call the same work and compares the answers." }
prompts:
  - id: security
    title: Security reviewer prompt
    lang: markdown
    source: |
      You review pull requests for security problems only. Ignore style,
      performance and tests; other reviewers cover them.

      <diff>{{diff}}</diff>

      List each problem with file, line and a one-sentence fix.
      If you find none, answer "No security issues."
  - id: merge
    title: Merge prompt
    lang: markdown
    source: |
      Combine these independent reviews of one pull request into a single
      comment. Group findings by severity and remove duplicates.

      <security>{{security}}</security>
      <performance>{{performance}}</performance>
      <tests>{{tests}}</tests>
diagram:
  nodes:
    - { id: user, kind: io, label: PR, description: "The pull request, arriving as a single code diff to be reviewed." }
    - { id: splitter, kind: router, label: Splitter, model: false, description: "Plain code, not a model: sends the same diff to each fixed review concern chosen in advance." }
    - { id: llm1, kind: llm, label: Security, description: "Reviews the diff for security problems only and lists each with file, line and a one-sentence fix." }
    - { id: llm2, kind: llm, label: Performance, description: "Reviews the same diff for performance problems only, ignoring security, style and tests." }
    - { id: llm3, kind: llm, label: Tests, description: "Reviews the same diff for missing or weak tests only, leaving other concerns to the other reviewers." }
    - { id: aggregator, kind: aggregator, label: Merge, description: "Combines the three independent reviews into one comment, grouped by severity and de-duplicated." }
    - { id: out, kind: io, label: Review, description: "The single merged review comment posted on the pull request." }
  edges:
    - { id: in, from: user, to: splitter, description: "The pull request's diff enters the splitter.", example: "diff --git a/api/users.py b/api/users.py  @@ -10,6 +10,28 @@ def get_user(id): ..." }
    - { id: s1, from: splitter, to: llm1, description: "The diff goes to the security reviewer with its security-only prompt.", example: "You review pull requests for security problems only. <diff>diff --git a/api/users.py ...</diff>" }
    - { id: s2, from: splitter, to: llm2, description: "The same diff goes to the performance reviewer in parallel.", example: "You review pull requests for performance problems only. <diff>diff --git a/api/users.py ...</diff>" }
    - { id: s3, from: splitter, to: llm3, description: "The same diff goes to the tests reviewer in parallel.", example: "You review pull requests for test coverage problems only. <diff>diff --git a/api/users.py ...</diff>" }
    - { id: m1, from: llm1, to: aggregator, description: "The security review is sent to the merge step as soon as it finishes.", example: "api/users.py:14 SQL built with f-string; use a parameterized query. api/users.py:31 token logged in plain text; remove it." }
    - { id: m2, from: llm2, to: aggregator, description: "The performance review is sent to the merge step when ready.", example: "api/users.py:22 query runs inside a loop (N+1); fetch all users with one IN query." }
    - { id: m3, from: llm3, to: aggregator, description: "The tests review is sent to the merge step; it may finish last.", example: "No test issues." }
    - { id: done, from: aggregator, to: out, description: "The merged review is delivered as the final output.", example: "Review: High: SQL injection at users.py:14. High: token logged at users.py:31. Medium: N+1 query at users.py:22. Tests: no issues." }
  scenarios:
    - id: pr-review
      label: '"Review this pull request"'
      steps:
        - { id: arrive, caption: A pull request arrives with one diff., duration: 1000, events: [{ type: send, edge: in, token: { kind: prompt, label: diff } }] }
        - id: fan-out
          caption: The same diff goes to three reviewers at once, each with a different concern.
          duration: 1400
          events:
            - { type: send, edge: s1, token: { kind: prompt, label: security } }
            - { type: send, edge: s2, token: { kind: prompt, label: perf } }
            - { type: send, edge: s3, token: { kind: prompt, label: tests } }
        - id: work
          caption: The reviewers run side by side and finish at different times.
          duration: 3000
          events:
            - { type: activate, node: llm1, status: thinking, at: [0, 0.35] }
            - { type: activate, node: llm2, status: thinking, at: [0, 0.65] }
            - { type: activate, node: llm3, status: thinking, at: [0, 0.9] }
            - { type: send, edge: m1, token: { kind: result, label: 2 issues }, at: [0.35, 0.55] }
            - { type: send, edge: m2, token: { kind: result, label: 1 issue }, at: [0.65, 0.85] }
            - { type: send, edge: m3, token: { kind: result, label: 0 issues }, at: [0.9, 1] }
        - id: merge
          caption: The merge step waits for the slowest reviewer, then combines all three reports.
          duration: 1800
          events:
            - { type: activate, node: aggregator, status: thinking, at: [0, 0.5] }
            - { type: send, edge: done, token: { kind: result, label: review }, at: [0.5, 1] }
