slug: model-fallback
name: Retries & Model Fallback
family: reliability-runtime
aliases: [Failover, Fallback chain, Provider redundancy, Retry with backoff]
summary: Retry failed model calls with backoff, then fail over down an ordered list of models, resting any that keep failing.
badges: { autonomy: low, cost: low, latency: medium }
sources:
  - title: "LiteLLM docs: Fallbacks, Retries & Cooldowns"
    url: https://docs.litellm.ai/docs/proxy/reliability
related:
  composesWith: [schema-repair, routing, augmented-llm]
  confusedWith:
    - slug: routing
      difference: "Routing picks a model by the input's category before any call is made. Fallback picks the next model only after a call has failed."
    - slug: model-cascade
      difference: "A cascade escalates when a call succeeds but its answer scores too low. Fallback moves on only when a call fails with an error."
origin:
  by: BerriAI (LiteLLM)
  org: BerriAI
  year: 2023
  url: https://docs.litellm.ai/docs/proxy/reliability
  kind: popularized
  uncertain: true
  note: "No single inventor: retries with backoff and failover are classic distributed-systems practice. LLM gateways such as LiteLLM made model-level fallbacks, context-window fallbacks and cooldowns a standard configuration around 2023."
build:
  goal: "Wrap every model call so that transient errors are retried with backoff, persistent failures fail over to the next model in an ordered list, and a model that keeps failing is skipped for a cooldown period."
  steps:
    - "Configure an ordered list of deployments (provider plus model), each with its context-window size, plus one long-context deployment for oversized inputs. Send every deployment the same {{prompt:system}}."
    - "Before a call, count the input tokens. If they exceed the first deployment's window, skip straight to the long-context deployment."
    - "Call the first deployment that is not cooling down. On a retryable error (rate limit, 5xx, timeout), wait with exponential backoff and jitter, honouring any Retry-After header that fits the remaining time budget, and try the same deployment again."
    - "After the retry budget for a deployment is spent, put it in cooldown and move to the next deployment in the list."
    - "On a fatal error, stop and return it to the caller at once, without failing over or cooling anything down: a malformed request fails on every model, and a model's refusal is an answer, not an outage."
    - "Return the response together with the deployment that served it and the number of attempts."
  stop: "Stop at the first successful response. If every deployment fails or is cooling down, raise one error that lists each deployment and its last error, so the caller can show a graceful message."
  requirements:
    - "Make retries per deployment (default 2), base backoff (default 1 s) and cooldown length (default 60 s) parameters."
    - "Classify errors in one function with a table of status codes, so retryable, fail-over and fatal errors are tested in one place; content refusals, detected from the response's stop reason or refusal field, are fatal and logged."
    - "Cap the total time across all attempts (default 30 s): if Retry-After exceeds the remaining budget, fail over instead of waiting. Never retry a streamed response once tokens have reached the user."
    - "Keep cooldown state shared across requests in the process, so one outage does not cost every request its own retries. Log every attempt with its deployment, error class and wait."
    - "Add a test with stub models where the primary returns 429 three times; assert three primary calls, one fallback call, the fallback's text returned, and that a second request goes straight to the fallback."
prompts:
  - id: system
    title: Portable system prompt
    lang: markdown
    source: |
      You are the support assistant for {{product}}. Answer the customer's
      question using only the help-centre articles provided.

      <articles>{{articles}}</articles>

      Rules:
      - Reply in plain text, at most 120 words, in the customer's language.
      - If the articles do not cover the question, say so and offer to open a ticket.
      - Never mention which AI model or provider you are.

      Write the prompt so that every model in the fallback list can follow it:
      no provider-specific tags, tools or formatting features.
diagram:
  nodes:
    - id: user
      kind: io
      label: Message
      description: "A customer's chat message, arriving while the primary provider is having an outage."
    - id: gateway
      kind: router
      label: Gateway
      sublabel: retry + cooldown
      model: false
      description: "Plain code wrapping every call: it counts tokens, retries with backoff, tracks which models are cooling down, and walks the fallback list."
    - id: m1
      kind: llm
      label: Primary
      description: "The first-choice model: best quality per dollar, used whenever it is healthy and the input fits its window."
    - id: m2
      kind: llm
      label: Fallback
      description: "A second model from a different provider, called only when the primary keeps failing or is cooling down."
    - id: m3
      kind: llm
      label: Long-context
      description: "A model with a much larger context window, used when the input is too long for the others."
    - id: out
      kind: io
      label: Reply
      description: "The answer sent back to the customer, tagged in the logs with the model that served it."
  edges:
    - id: in
      from: user
      to: gateway
      description: "The request enters the gateway, which counts its tokens and checks which models are healthy."
      example: "My invoice shows two charges for March. Can you refund one?"
    - id: call1
      from: gateway
      to: m1
      description: "The gateway calls the primary model first, with the shared system prompt."
      example: "POST /v1/messages model=primary, 1,850 input tokens, timeout 30 s"
    - id: err
      from: m1
      to: gateway
      style: loop
      label: 429 / 503
      description: "A retryable error comes back; the gateway waits with exponential backoff and tries again."
      example: "HTTP 429 Too Many Requests, Retry-After: 2. Waiting 2.0 s before attempt 2 of 3."
    - id: call2
      from: gateway
      to: m2
      label: fail over
      description: "Once the primary's retries are spent it goes into cooldown, and the same request goes to the next model on the list."
      example: "primary cooling down for 60 s after 3 errors; calling fallback, attempt 1."
    - id: call3
      from: gateway
      to: m3
      style: dashed
      label: too long
      description: "If the input is bigger than the normal models' context window, the gateway skips straight to the long-context model."
      example: "Input is 212,000 tokens (customer pasted a full log export); primary limit 128,000. Routing to long-context."
    - id: r1
      from: m1
      to: out
      description: "On a healthy day, the primary's answer goes straight to the customer."
      example: "I can see two March charges of 49.00 EUR. I've refunded the duplicate; it will reach your card in 5 to 10 days."
    - id: r2
      from: m2
      to: out
      description: "During the outage, the fallback's answer goes to the customer, who never sees the errors."
      example: "Sorry about that: the second March charge was a duplicate. I've refunded 49.00 EUR to your card."
    - id: r3
      from: m3
      to: out
      description: "The long-context model's answer goes back the same way as any other."
      example: "Your log shows the sync failing at 02:14 each night on the same file; here is how to exclude it."
  scenarios:
    - id: outage
      label: Primary outage
      steps:
        - id: arrive
          caption: A customer's message reaches the gateway, which calls the primary model.
          duration: 1800
          events:
            - { type: send, edge: in, token: { kind: prompt, label: message }, at: [0, 0.45] }
            - { type: send, edge: call1, token: { kind: prompt, label: attempt 1 }, at: [0.5, 1] }
        - id: retry
          caption: The primary fails with a 429 rate limit; the gateway backs off, waiting longer each time, and retries.
          duration: 2400
          repeat: 2
          events:
            - { type: activate, node: m1, status: error, at: [0, 0.3] }
            - { type: send, edge: err, token: { kind: feedback, label: "429" }, at: [0.3, 0.6] }
            - { type: activate, node: gateway, status: waiting, at: [0.6, 0.8] }
            - { type: send, edge: call1, token: { kind: prompt, label: retry }, at: [0.8, 1] }
        - id: cooldown
          caption: The third failure exhausts the retries, so the primary is put in a 60-second cooldown.
          duration: 2000
          events:
            - { type: activate, node: m1, status: error, at: [0, 0.4] }
            - { type: send, edge: err, token: { kind: feedback, label: "503" }, at: [0.4, 0.8] }
            - { type: activate, node: m1, status: waiting, at: [0.8, 1] }
        - id: failover
          caption: The gateway fails over to the second model, which answers; the customer never sees an error.
          duration: 2600
          events:
            - { type: branch, node: gateway, taken: call2, notTaken: [call1, call3], at: [0, 0.15] }
            - { type: send, edge: call2, token: { kind: prompt, label: fallback }, at: [0.15, 0.45] }
            - { type: activate, node: m2, status: thinking, at: [0.45, 0.7] }
            - { type: send, edge: r2, token: { kind: result, label: reply }, at: [0.7, 0.95] }
            - { type: activate, node: out, status: done, at: [0.9, 1] }
    - id: long-input
      label: Input too long
      steps:
        - id: arrive
          caption: A customer pastes a 212,000-token log export, far beyond the primary's window.
          duration: 1600
          events:
            - { type: send, edge: in, token: { kind: prompt, label: 212k tokens }, at: [0, 0.6] }
            - { type: activate, node: gateway, status: thinking, at: [0.6, 1] }
        - id: skip
          caption: The gateway skips the primary and fallback and sends the request straight to the long-context model.
          duration: 2800
          events:
            - { type: branch, node: gateway, taken: call3, notTaken: [call1, call2], at: [0, 0.15] }
            - { type: send, edge: call3, token: { kind: prompt, label: 212k tokens }, at: [0.15, 0.45] }
            - { type: activate, node: m3, status: thinking, at: [0.45, 0.7] }
            - { type: send, edge: r3, token: { kind: result, label: reply }, at: [0.7, 0.95] }
            - { type: activate, node: out, status: done, at: [0.9, 1] }
