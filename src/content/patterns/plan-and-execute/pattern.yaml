slug: plan-and-execute
name: Plan-and-Execute
family: planning-search
aliases: [Plan-and-Solve, Planner-executor, Planning]
summary: A planner writes a step list, an executor runs each step, and a replanner revises the remaining steps.
badges: { autonomy: high, cost: high, latency: high }
sources:
  - title: "Plan-and-Solve Prompting: Improving Zero-Shot Chain-of-Thought Reasoning by Large Language Models (Wang et al., 2023)"
    url: https://arxiv.org/abs/2305.04091
  - title: Plan-and-Execute Agents (LangChain, 2024)
    url: https://www.langchain.com/blog/planning-agents
related:
  composesWith: [react, reflexion]
  confusedWith:
    - { slug: orchestrator-workers, difference: "Orchestrator-Workers hands subtasks to plain LLM workers once and synthesizes; Plan-and-Execute keeps an explicit, persistent plan that a replanner revises after every step." }
    - { slug: react, difference: "ReAct chooses one action at a time with no written plan; Plan-and-Execute writes the whole plan first, then lets a replanner adjust it as results arrive." }
prompts:
  - id: planner
    title: Planner prompt
    lang: markdown
    source: |
      For the goal below, write a step-by-step plan. Each step must be a
      self-contained task that one worker with {{tool_names}} can complete.
      Use as few steps as possible. Do not add a step that only restates
      the goal.

      <goal>{{goal}}</goal>

      Respond as a numbered list. The last step should produce the final answer.
  - id: replanner
    title: Replanner prompt
    lang: markdown
    source: |
      Goal: {{goal}}

      Current plan:
      {{plan}}

      Steps already completed, with results:
      {{past_steps}}

      Update the plan. Remove steps that are done or no longer needed, and
      add or change steps if the results require it. Do not repeat a
      completed step.

      If you can already answer the goal, respond with:
      {"final_answer": "..."}
      Otherwise respond with:
      {"remaining_steps": ["...", "..."]}
diagram:
  nodes:
    - id: user
      kind: io
      label: Goal
      description: "The open-ended goal, such as 'Write a brief on a competitor'."
    - id: planner
      kind: llm
      label: Planner
      description: "Writes the whole step-by-step plan once, before any tool is used; the last step yields the answer."
    - id: plan
      kind: memory
      label: Plan
      description: "The explicit, inspectable list of remaining steps; the executor reads it and the replanner rewrites it."
    - id: executor
      kind: agent
      label: Executor
      description: "A small ReAct-style agent that completes one plan step at a time using the tools."
    - id: tool
      kind: tool
      label: Tools
      description: "The tools the executor calls to do a step, such as web search for a competitor's pricing."
    - id: replanner
      kind: llm
      label: Replanner
      description: "After each step, compares the plan and results so far, then returns revised steps or the final answer."
    - id: out
      kind: io
      label: Answer
      description: "The finished deliverable, such as the competitor brief, returned when the replanner has a final_answer."
  edges:
    - id: goal
      from: user
      to: planner
      description: "The goal goes to the planner before any tool is touched."
      example: "Write a one-page brief on competitor Acme: products, pricing and recent news."
    - id: draft
      from: planner
      to: plan
      label: steps
      description: "The planner's numbered step list is stored as the plan."
      example: "1. Find Acme's product lines and pricing. 2. Find recent news. 3. Write the brief from the findings."
    - id: next
      from: plan
      to: executor
      label: next step
      description: "The first remaining step is handed to the executor as a self-contained task."
      example: "Find Acme's product lines and pricing."
    - id: call
      from: executor
      to: tool
      description: "A tool call the executor makes while working on the current step."
      example: "web_search(query=\"Acme pricing plans 2026\")"
    - id: observe
      from: tool
      to: executor
      style: dashed
      description: "The tool's output returns to the executor to use in finishing the step."
      example: "Acme sells Basic ($20/mo), Pro ($60/mo) and Enterprise (custom)."
    - id: report
      from: executor
      to: replanner
      label: result
      description: "The finished step and its result are recorded as a past step for the replanner."
      example: "Step 1 done: Acme has three tiers, Basic $20, Pro $60, Enterprise custom."
    - id: revise
      from: replanner
      to: plan
      style: loop
      label: revise
      description: "The replanner writes back the updated remaining steps, not merely the old list minus one step."
      example: "{\"remaining_steps\": [\"Find recent Acme news, focusing on the Enterprise launch\", \"Write the brief\"]}"
    - id: finish
      from: replanner
      to: out
      label: done
      description: "When the results already answer the goal, the replanner returns the final answer instead of steps."
      example: "{\"final_answer\": \"Acme Competitor Brief: three pricing tiers, strong Enterprise push...\"}"
  scenarios:
    - id: competitor-brief
      label: '"Write a brief on a competitor"'
      steps:
        - id: start
          caption: The goal reaches the planner before any tool is touched.
          duration: 1000
          events:
            - { type: send, edge: goal, token: { kind: prompt, label: brief goal } }
        - id: plan
          caption: The planner writes a three-step plan and stores it as an explicit, inspectable list.
          duration: 2600
          events:
            - { type: activate, node: planner, status: thinking, at: [0, 0.4] }
            - { type: send, edge: draft, token: { kind: tokens, label: 3 steps }, at: [0.4, 0.8] }
            - { type: write, node: plan, at: [0.8, 1] }
        - id: run-step
          caption: The executor does the next step with its tools, and the replanner revises what remains.
          duration: 4400
          repeat: 2
          events:
            - { type: read, node: plan, at: [0, 0.1] }
            - { type: send, edge: next, token: { kind: prompt, label: step }, at: [0.1, 0.22] }
            - { type: send, edge: call, token: { kind: tool-call }, at: [0.22, 0.34] }
            - { type: activate, node: tool, status: calling, at: [0.34, 0.44] }
            - { type: send, edge: observe, token: { kind: result }, at: [0.44, 0.56] }
            - { type: send, edge: report, token: { kind: result, label: finding }, at: [0.56, 0.68] }
            - { type: branch, node: replanner, taken: revise, notTaken: [finish], at: [0.68, 0.78] }
            - { type: send, edge: revise, token: { kind: feedback, label: new plan }, at: [0.78, 0.9] }
            - { type: write, node: plan, at: [0.9, 1] }
        - id: last-step
          caption: After the final step the replanner sees the goal is met and returns the answer instead of a new plan.
          duration: 4400
          events:
            - { type: read, node: plan, at: [0, 0.1] }
            - { type: send, edge: next, token: { kind: prompt, label: step }, at: [0.1, 0.22] }
            - { type: send, edge: call, token: { kind: tool-call }, at: [0.22, 0.34] }
            - { type: activate, node: tool, status: calling, at: [0.34, 0.44] }
            - { type: send, edge: observe, token: { kind: result }, at: [0.44, 0.56] }
            - { type: send, edge: report, token: { kind: result, label: finding }, at: [0.56, 0.68] }
            - { type: branch, node: replanner, taken: finish, notTaken: [revise], at: [0.68, 0.78] }
            - { type: send, edge: finish, token: { kind: result, label: brief }, at: [0.78, 1] }
