slug: role-play
name: Role-Play
family: multi-agent
aliases: [CAMEL, Inception prompting, AI user and AI assistant, Two-agent society]
summary: Two role-prompted agents, an instructor and a doer, trade instructions and solutions turn by turn until the instructor declares the task done.
badges: { autonomy: high, cost: medium, latency: high }
sources:
  - title: "CAMEL: Communicative Agents for 'Mind' Exploration of Large Language Model Society (Li et al., 2023)"
    url: https://arxiv.org/abs/2303.17760
related:
  composesWith: [evaluator-optimizer]
  confusedWith:
    - { slug: debate, difference: "Debaters argue toward a verdict on one question; role-play agents cooperate under fixed instructor and doer roles to build something." }
    - { slug: group-chat, difference: "A group chat has any number of agents and a manager choosing the next speaker; role-play has exactly two agents that always alternate." }
    - { slug: evaluator-optimizer, difference: "An evaluator only judges finished drafts; the role-play instructor drives the work step by step, deciding what the doer should do next." }
origin:
  by: Guohao Li et al.
  org: KAUST
  year: 2023
  url: https://arxiv.org/abs/2303.17760
  kind: introduced
  note: "CAMEL introduced inception prompting: each agent's system prompt fixes both roles and the task, so the pair can cooperate for many turns without a human."
build:
  goal: "Complete a task through a conversation between two role-prompted agents, an AI user that gives one instruction at a time and an AI assistant that carries each one out, after a specifier turns the rough idea into a concrete task."
  steps:
    - "Call the model with the {{prompt:specifier}}, passing the rough idea and both role names, to get a specific, concrete task."
    - "Build the AI user's system prompt from the {{prompt:ai-user}} and the AI assistant's from the {{prompt:ai-assistant}}, each with both role names and the specified task. Keep a separate message history for each agent."
    - "Ask the AI user for its first instruction. Pass each instruction to the AI assistant as a user message, and pass each solution back to the AI user the same way."
    - "Check the format of every reply: the AI user must start with 'Instruction:' or send the done token, and the AI assistant must start with 'Solution:'. On a mismatch, resend that agent's role rules and ask again, once."
    - "When the AI user's message contains <CAMEL_TASK_DONE>, return the specified task, the full transcript and the assistant's solutions in order."
  stop: "Stop when the AI user sends <CAMEL_TASK_DONE>, or after 20 instruction and solution rounds. On the cap, return the transcript with a status of max_rounds. If one agent repeats the same message three times, stop early with a status of looping."
  requirements:
    - "Never let the roles flip: the AI user only instructs and the AI assistant only solves. Treat a reply in the wrong role as a format error."
    - "Make the round cap a parameter (default 20), and detect three identical consecutive messages from either agent as a loop."
    - "The two agents may use different models, configured separately; the specifier can be a cheaper model."
    - "Log every message with its role, its round number and its token count."
    - "Add a test with a stub LLM whose AI user sends two instructions and then <CAMEL_TASK_DONE>; assert exactly two AI assistant calls and a transcript ordered instruction, solution, instruction, solution, done."
prompts:
  - id: specifier
    title: Task specifier prompt
    lang: markdown
    source: |
      Here is a task that {{assistant_role}} will help {{user_role}} to complete:
      <idea>{{idea}}</idea>

      Make it more specific: name the concrete deliverable, the inputs it works on
      and how we will know it is finished. Be creative but realistic.
      Reply with the specified task only, in {{word_limit}} words or fewer.
  - id: ai-user
    title: AI user (instructor) prompt
    lang: markdown
    source: |
      Never forget you are a {{user_role}} and I am a {{assistant_role}}. Never flip roles!
      We share a common interest in completing this task: {{task}}

      You must instruct me, one instruction at a time, to complete the task.
      Always reply in this form:
      Instruction: <one concrete instruction>
      Input: <the input it needs, or None>

      Give instructions only, never solutions. Do not ask me questions.
      When the task is fully complete, reply with only: <CAMEL_TASK_DONE>
  - id: ai-assistant
    title: AI assistant (doer) prompt
    lang: markdown
    source: |
      Never forget you are a {{assistant_role}} and I am a {{user_role}}. Never flip roles!
      We share a common interest in completing this task: {{task}}

      I will give you one instruction at a time. Carry out each one with a
      specific, complete solution. If you cannot, say why and decline.
      Always reply in this form:
      Solution: <your solution, with any code or detail it needs>
      Next request.

      Never give me instructions, and never ask me questions.
diagram:
  nodes:
    - { id: idea, kind: io, label: Idea, description: "The rough goal a human types once, such as 'Develop a trading bot for the stock market'." }
    - { id: specifier, kind: llm, label: Task specifier, description: "Turns the vague idea into a concrete task with a clear deliverable, before either agent starts." }
    - { id: aiuser, kind: agent, label: AI user, sublabel: "role: stock trader", description: "The instructor. Plays the stock trader: decides what to do next and gives one instruction at a time; never writes the solution." }
    - { id: aiassistant, kind: agent, label: AI assistant, sublabel: "role: Python programmer", description: "The doer. Plays the Python programmer: carries out each instruction with a concrete solution; never gives instructions." }
    - { id: out, kind: io, label: Result, description: "The transcript and the assistant's solutions, returned once the AI user declares the task done." }
  edges:
    - { id: seed, from: idea, to: specifier, description: "The rough idea and both role names go to the task specifier.", example: "Idea: Develop a trading bot for the stock market. Roles: Stock Trader, Python Programmer." }
    - { id: brief-user, from: specifier, to: aiuser, label: task, description: "The specified task is written into the AI user's inception prompt, alongside both roles.", example: "Task: Build a Python bot that reads Reddit sentiment on 5 tickers and places paper trades when sentiment flips." }
    - { id: brief-assistant, from: specifier, to: aiassistant, style: dashed, description: "The same specified task is written into the AI assistant's inception prompt, so both agents share one goal.", example: "Never forget you are a Python Programmer and I am a Stock Trader. Task: Build a Python bot that reads Reddit sentiment..." }
    - { id: instruct, from: aiuser, to: aiassistant, label: Instruction, description: "One instruction at a time, with the input it needs, passed to the assistant as its next user message.", example: "Instruction: Write a function that fetches the last 24 hours of posts mentioning a ticker. Input: tickers = ['AAPL', 'TSLA']" }
    - { id: solve, from: aiassistant, to: aiuser, style: loop, label: Solution, description: "The assistant's solution goes back to the AI user, who reads it and decides the next instruction.", example: "Solution: def fetch_posts(ticker, hours=24): ... returns a list of {text, score, created}. Next request." }
    - { id: done, from: aiuser, to: out, label: TASK_DONE, description: "When the AI user judges the task complete, it sends the done token instead of another instruction.", example: "<CAMEL_TASK_DONE>" }
  scenarios:
    - id: ping-pong
      label: Instruction and solution
      steps:
        - id: specify
          caption: The specifier turns the rough idea into a concrete task and writes it into both agents' role prompts.
          duration: 2600
          events:
            - { type: send, edge: seed, token: { kind: prompt, label: idea }, at: [0, 0.3] }
            - { type: activate, node: specifier, status: thinking, at: [0.3, 0.6] }
            - { type: send, edge: brief-user, token: { kind: prompt, label: task }, at: [0.6, 1] }
            - { type: send, edge: brief-assistant, token: { kind: prompt, label: task }, at: [0.6, 1] }
        - id: exchange
          caption: The AI user gives one instruction; the AI assistant answers with a solution and asks for the next request.
          duration: 3200
          repeat: 3
          events:
            - { type: activate, node: aiuser, status: thinking, at: [0, 0.2] }
            - { type: send, edge: instruct, token: { kind: prompt, label: Instruction }, at: [0.2, 0.45] }
            - { type: activate, node: aiassistant, status: thinking, at: [0.45, 0.7] }
            - { type: send, edge: solve, token: { kind: result, label: Solution }, at: [0.7, 1] }
        - id: finish
          caption: Satisfied that the bot is complete, the AI user sends the done token instead of an instruction.
          duration: 2200
          events:
            - { type: activate, node: aiuser, status: thinking, at: [0, 0.35] }
            - { type: branch, node: aiuser, taken: done, notTaken: [instruct], at: [0.35, 0.5] }
            - { type: send, edge: done, token: { kind: result, label: TASK_DONE }, at: [0.5, 0.9] }
            - { type: activate, node: out, status: done, at: [0.85, 1] }
    - id: role-drift
      label: Role drift, caught
      steps:
        - id: specify
          caption: The specifier writes the concrete task into both role prompts.
          duration: 2000
          events:
            - { type: send, edge: brief-user, token: { kind: prompt, label: task }, at: [0, 0.6] }
            - { type: send, edge: brief-assistant, token: { kind: prompt, label: task }, at: [0, 0.6] }
        - id: drift
          caption: The assistant flips roles and replies with an instruction of its own, so the format check rejects it.
          duration: 3000
          events:
            - { type: send, edge: instruct, token: { kind: prompt, label: Instruction }, at: [0, 0.3] }
            - { type: activate, node: aiassistant, status: thinking, at: [0.3, 0.55] }
            - { type: send, edge: solve, token: { kind: feedback, label: "Instruction?" }, at: [0.55, 0.85] }
            - { type: activate, node: aiassistant, status: error, at: [0.8, 1] }
        - id: remind
          caption: The instruction is resent with the assistant's role rules attached, and this time it answers with a solution.
          duration: 3000
          events:
            - { type: send, edge: instruct, token: { kind: prompt, label: role reminder }, at: [0, 0.35] }
            - { type: activate, node: aiassistant, status: thinking, at: [0.35, 0.65] }
            - { type: send, edge: solve, token: { kind: result, label: Solution }, at: [0.65, 1] }
