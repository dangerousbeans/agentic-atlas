slug: corrective-rag
name: Corrective RAG
family: knowledge-memory
aliases: [CRAG]
summary: Grade the retrieved documents. If they're irrelevant, rewrite the query and fall back to web search before generating.
badges: { autonomy: low, cost: medium, latency: medium }
sources:
  - title: "Corrective Retrieval Augmented Generation (Yan et al., 2024)"
    url: https://arxiv.org/abs/2401.15884
  - title: "Self-RAG: Learning to Retrieve, Generate, and Critique through Self-Reflection (Asai et al., 2023)"
    url: https://arxiv.org/abs/2310.11511
related:
  composesWith: [agentic-rag, evaluator-optimizer]
  confusedWith: []
origin:
  by: Shi-Qi Yan et al.
  org: University of Science and Technology of China, UCLA, Google DeepMind
  year: 2024
  url: https://arxiv.org/abs/2401.15884
  kind: introduced
build:
  goal: "Answer a question from an internal index, but grade the retrieved documents first, fall back to a rewritten web search when none is relevant, and check the answer against its documents."
  steps:
    - "Retrieve the top 4 documents for the question from the internal index."
    - "Grade each document with the {{prompt:grader}}, parsing its JSON into relevant and reason, and keep the relevant ones."
    - "If none is relevant, call the {{prompt:rewriter}} with the question and the rejection reasons, run its query on web search, and use the web results as the documents."
    - "Generate an answer from the documents, then run the {{prompt:check}} on it and parse the list of unsupported claims."
    - "If any claim is unsupported, regenerate with that list, telling the model to drop or fix those claims, and check again."
  stop: "Stop when the check finds every claim supported, or after 2 regenerations. At the cap, return the last answer with its unsupported claims removed, and a status saying the check did not fully pass."
  requirements:
    - "Make the documents retrieved (default 4) and the regeneration cap (default 2) parameters."
    - "If a grader reply is not valid JSON, treat that document as not relevant and log the raw reply."
    - "If web search fails or returns nothing, reply that the answer could not be found rather than generating from rejected documents."
    - "Log every grade with its reason, the rewritten query and each check result."
    - "Add a test with a stub grader that rejects all 4 documents and a stub web search; assert the rewriter ran once, web search ran once, and the generator received only the web documents."
defaultVariantName: Grade and fall back
prompts:
  - id: grader
    title: Document grader prompt
    lang: markdown
    source: |
      You grade whether a retrieved document helps answer a question.

      <question>{{question}}</question>
      <document>{{doc}}</document>

      Respond in JSON: {"relevant": true|false, "reason": "one sentence"}
      Mark relevant only if the document contains facts needed for the answer.
      A document on the same topic that does not answer the question is not relevant.
  - id: rewriter
    title: Query rewriter prompt
    lang: markdown
    source: |
      The internal search returned nothing useful for this question.

      <question>{{question}}</question>
      <rejected_reasons>{{reasons}}</rejected_reasons>

      Write one web search query that would find the missing facts. Use specific
      terms and names, not the full question. Return only the query.
  - id: check
    title: Answer check prompt
    lang: markdown
    source: |
      Check whether every claim in the answer is supported by the documents.

      <documents>{{docs}}</documents>
      <answer>{{answer}}</answer>

      Respond in JSON:
      {"supported": true|false, "unsupported_claims": ["claim", "..."]}
diagram:
  nodes:
    - { id: user, kind: io, label: Question, description: "The user's question, e.g. 'Who is our current vendor for payroll?', sent to the internal index first." }
    - { id: retriever, kind: memory, label: Retriever, description: "Searches the internal index and returns the top documents for the question, relevant or not." }
    - { id: grader, kind: evaluator, label: Doc grader, description: "Reads each retrieved document and returns JSON saying whether it contains facts needed for the answer." }
    - { id: rewriter, kind: llm, label: Rewriter, description: "When every document is rejected, turns the question into one sharp web query using the rejection reasons." }
    - { id: web, kind: tool, label: Web search, description: "External web search that replaces the failed internal retrieval with fresh documents." }
    - { id: generator, kind: llm, label: Generator, description: "Writes the answer from the kept or web documents, revising when the answer check flags claims." }
    - { id: check, kind: evaluator, label: Answer check, description: "Checks every claim in the draft against the documents and lists any unsupported claims." }
    - { id: out, kind: io, label: Answer, description: "The final answer: released once the check passes, or the best answer after retries run out." }
  edges:
    - { id: ask, from: user, to: retriever, description: "The question goes to the internal retriever.", example: "Question: Who is our current vendor for payroll?" }
    - { id: docs, from: retriever, to: grader, description: "The top retrieved documents are handed to the grader one by one.", example: "4 docs: [{\"id\": \"kb-112\", \"text\": \"Payroll vendor evaluation notes, 2021...\"}, ...]" }
    - { id: reject, from: grader, to: rewriter, label: irrelevant, description: "If no document is relevant, the grader's reasons go to the rewriter.", example: "{\"relevant\": false, \"reason\": \"Discusses a 2021 payroll vendor evaluation, not the current vendor.\"}" }
    - { id: keep, from: grader, to: generator, label: relevant, description: "Documents graded relevant skip the web and go straight to the generator.", example: "{\"relevant\": true, \"reason\": \"States the current payroll vendor and contract end date.\"} -> 2 docs kept" }
    - { id: rewrite, from: rewriter, to: web, description: "The rewriter's single query is sent to web search.", example: "Web query: \"Acme Corp payroll provider 2026\"" }
    - { id: fetch, from: web, to: generator, description: "Web results become the generator's documents.", example: "web docs: [\"Acme Corp switched payroll to Gusto in March 2025 (press release)\", ...]" }
    - { id: draft, from: generator, to: check, description: "Each draft answer goes to the check along with the documents it should rest on.", example: "Acme uses Gusto for payroll since March 2025, on a three-year contract." }
    - { id: regen, from: check, to: generator, style: loop, label: unsupported, description: "Unsupported claims go back to the generator so it can drop or fix them.", example: "{\"supported\": false, \"unsupported_claims\": [\"on a three-year contract\"]}" }
    - { id: accept, from: check, to: out, label: supported, description: "A fully supported answer leaves the pipeline unchanged.", example: "{\"supported\": true, \"unsupported_claims\": []}" }
  scenarios:
    - id: docs-irrelevant
      label: Retrieved docs are irrelevant
      steps:
        - id: retrieve
          caption: The question hits the internal index and the top documents come back.
          duration: 2000
          events:
            - { type: send, edge: ask, token: { kind: prompt, label: question }, at: [0, 0.5] }
            - { type: read, node: retriever, at: [0.5, 0.75] }
            - { type: send, edge: docs, token: { kind: result, label: 4 docs }, at: [0.75, 1] }
        - id: grade
          caption: The grader reads each document and rejects them all as off-topic.
          duration: 2200
          events:
            - { type: activate, node: grader, status: error, at: [0, 0.6] }
            - { type: branch, node: grader, taken: reject, notTaken: [keep], at: [0.6, 1] }
        - id: rewrite
          caption: The rewriter turns the question into a sharper web query and the search runs.
          duration: 2800
          events:
            - { type: send, edge: reject, token: { kind: feedback, label: rejected }, at: [0, 0.25] }
            - { type: activate, node: rewriter, status: thinking, at: [0.25, 0.5] }
            - { type: send, edge: rewrite, token: { kind: tool-call, label: web query }, at: [0.5, 0.75] }
            - { type: activate, node: web, status: calling, at: [0.75, 1] }
        - id: generate
          caption: The generator writes the answer from the fresh web results.
          duration: 2400
          events:
            - { type: send, edge: fetch, token: { kind: result, label: web docs }, at: [0, 0.4] }
            - { type: activate, node: generator, status: thinking, at: [0.4, 0.7] }
            - { type: send, edge: draft, token: { kind: result, label: draft }, at: [0.7, 1] }
        - id: verify
          caption: The answer check finds every claim supported and the answer is returned.
          duration: 2000
          events:
            - { type: branch, node: check, taken: accept, notTaken: [regen], at: [0, 0.5] }
            - { type: send, edge: accept, token: { kind: result, label: answer }, at: [0.5, 1] }
    - id: self-check
      label: Good docs, but the draft fails the check
      steps:
        - id: retrieve
          caption: The question hits the internal index and the top documents come back.
          duration: 2000
          events:
            - { type: send, edge: ask, token: { kind: prompt, label: question }, at: [0, 0.5] }
            - { type: read, node: retriever, at: [0.5, 0.75] }
            - { type: send, edge: docs, token: { kind: result, label: 4 docs }, at: [0.75, 1] }
        - id: grade
          caption: The grader keeps the relevant documents and sends them straight to the generator.
          duration: 2200
          events:
            - { type: activate, node: grader, status: thinking, at: [0, 0.5] }
            - { type: branch, node: grader, taken: keep, notTaken: [reject], at: [0.5, 0.75] }
            - { type: send, edge: keep, token: { kind: result, label: 2 kept }, at: [0.75, 1] }
        - id: first-draft
          caption: The first draft contains a claim no document supports, so the check sends it back.
          duration: 3200
          events:
            - { type: activate, node: generator, status: thinking, at: [0, 0.25] }
            - { type: send, edge: draft, token: { kind: result, label: draft }, at: [0.25, 0.5] }
            - { type: branch, node: check, taken: regen, notTaken: [accept], at: [0.5, 0.7] }
            - { type: send, edge: regen, token: { kind: feedback, label: bad claim }, at: [0.7, 1] }
        - id: second-draft
          caption: The generator drops the unsupported claim, the check passes and the answer ships.
          duration: 2800
          events:
            - { type: activate, node: generator, status: thinking, at: [0, 0.3] }
            - { type: send, edge: draft, token: { kind: result, label: draft }, at: [0.3, 0.55] }
            - { type: branch, node: check, taken: accept, notTaken: [regen], at: [0.55, 0.75] }
            - { type: send, edge: accept, token: { kind: result, label: answer }, at: [0.75, 1] }
variants:
  - id: self-rag
    name: Self-RAG
    summary: "One model decides on demand whether to retrieve, then critiques each passage and its own output with reflection tokens; there is no separate grader."
    origin:
      by: Akari Asai et al.
      org: University of Washington, Allen Institute for AI, IBM Research AI
      year: 2023
      url: https://arxiv.org/abs/2310.11511
      kind: introduced
      note: "Self-RAG trains the model to emit the reflection tokens itself (ICLR 2024). With an untrained model, a prompt can ask for the same tags, less reliably."
    build:
      goal: "Let one model decide on demand whether to retrieve, judge each passage's relevance and its own output's support with reflection tokens, and keep the best-scored continuation."
      steps:
        - "Use a model trained, or prompted with the {{prompt:self-rag}}, to emit reflection tokens: Retrieve (yes, no, or continue to reuse the current passages), IsRel (relevant or irrelevant), IsSup (fully, partially or not supported) and IsUse (1 to 5)."
        - "Generate the next segment. If the model emits Retrieve=yes, search the index with the question plus the answer so far and take the top 4 passages."
        - "For each passage, generate a candidate segment in parallel and read the IsRel and IsSup tokens the model emits for it."
        - "Score each candidate as a weighted sum of its IsRel, IsSup and IsUse tokens, keep the best one and append it to the answer (the paper keeps the top 2 with a beam search)."
        - "When the model emits Retrieve=no, generate the segment without passages."
        - "If a candidate's reflection tokens cannot be parsed, give it the lowest score instead of failing the request."
      stop: "Stop when the model ends its answer, or after 6 segments. Return the answer with each segment's IsSup tag, so partly supported text can be shown as such."
      requirements:
        - "Make the segment cap (default 6), the passages per retrieval (default 4) and the score weights (defaults IsRel 1.0, IsSup 1.0, IsUse 0.5) parameters."
        - "Expose a retrieval threshold: retrieve when the probability of Retrieve=yes is above it (default 0.2), where the model exposes token probabilities."
        - "Log every segment's candidates with their reflection tokens and scores."
        - "Add a test with a stub model that emits Retrieve=no for a rewording task; assert the retriever is never called and one segment is returned."
    prompts:
      - id: self-rag
        title: Self-reflective answer prompt
        lang: markdown
        source: |
          Answer the question one short segment at a time.

          <question>{{question}}</question>
          <answer_so_far>{{answer}}</answer_so_far>
          {{#if passage}}<passage>{{passage}}</passage>{{/if}}

          Before each segment, write [Retrieve=Yes] if you need a new document,
          [Retrieve=Continue] to keep using the current passage, else [Retrieve=No].
          If a passage is given, write [IsRel=Relevant] or [IsRel=Irrelevant] for it.
          If a passage was given, after the segment write [IsSup=Fully], [IsSup=Partially]
          or [IsSup=No] for how well it supports the segment.
          Finally write [IsUse=1..5] for the segment's usefulness.
    diagram:
      nodes:
        - { id: user, kind: io, label: Question, description: "The user's question, e.g. 'Who is our current vendor for payroll?'." }
        - { id: model, kind: llm, label: Self-RAG model, sublabel: emits reflection tokens, description: "One model that decides whether to retrieve, tags each passage's relevance and rates how well each segment is supported." }
        - { id: retriever, kind: memory, label: Retriever, description: "The internal index, searched only when the model emits Retrieve=Yes." }
        - { id: out, kind: io, label: Answer, description: "The answer built from the best-scored segments, each carrying its support tag." }
      edges:
        - { id: ask, from: user, to: model, description: "The question goes straight to the model; there is no up-front retrieval.", example: "Question: Who is our current vendor for payroll?" }
        - { id: retrieve, from: model, to: retriever, label: "[Retrieve]", description: "When the model emits Retrieve=Yes, the question plus the answer so far is sent to the index.", example: "[Retrieve=Yes] query: \"current payroll vendor\"" }
        - { id: passages, from: retriever, to: model, style: dashed, label: passages, description: "Each passage gets its own candidate segment, and the model tags each passage's relevance.", example: "kb-112 2021 vendor review [IsRel=Irrelevant]; kb-207 Gusto contract, March 2025 [IsRel=Relevant]" }
        - { id: answer, from: model, to: out, label: "[IsSup]", description: "The best-scored candidate, relevant and fully supported, becomes the answer.", example: "Acme has used Gusto for payroll since March 2025. [IsSup=Fully] [IsUse=5]" }
      scenarios:
        - id: retrieves
          label: Retrieves, then critiques the passages
          steps:
            - id: ask
              caption: The question reaches the model, which decides it needs a document and emits Retrieve=Yes.
              duration: 2400
              events:
                - { type: send, edge: ask, token: { kind: prompt, label: question }, at: [0, 0.4] }
                - { type: activate, node: model, status: thinking, at: [0.4, 0.7] }
                - { type: branch, node: model, taken: retrieve, notTaken: [answer], at: [0.7, 1] }
            - id: search
              caption: The index returns four passages.
              duration: 2400
              events:
                - { type: send, edge: retrieve, token: { kind: tool-call, label: query }, at: [0, 0.4] }
                - { type: read, node: retriever, at: [0.4, 0.6] }
                - { type: send, edge: passages, token: { kind: result, label: 4 passages }, at: [0.6, 1] }
            - id: critique
              caption: The model drafts a segment per passage and tags each one; the 2021 vendor review is marked irrelevant.
              duration: 2600
              events:
                - { type: activate, node: model, status: thinking, at: [0, 1] }
            - id: answer
              caption: The fully supported segment from the Gusto contract scores highest and becomes the answer.
              duration: 2200
              events:
                - { type: branch, node: model, taken: answer, notTaken: [retrieve], at: [0, 0.3] }
                - { type: send, edge: answer, token: { kind: result, label: Gusto }, at: [0.3, 1] }
        - id: no-retrieval
          label: No retrieval needed
          steps:
            - id: ask
              caption: A request to reword a sentence reaches the model, which emits Retrieve=No.
              duration: 2400
              events:
                - { type: send, edge: ask, token: { kind: prompt, label: reword }, at: [0, 0.4] }
                - { type: activate, node: model, status: thinking, at: [0.4, 0.7] }
                - { type: branch, node: model, taken: answer, notTaken: [retrieve], at: [0.7, 1] }
            - id: answer
              caption: It writes the answer without touching the index.
              duration: 1800
              events:
                - { type: send, edge: answer, token: { kind: result, label: answer }, at: [0, 1] }
  - id: groundedness
    name: Groundedness loop
    summary: "After generating, a grader checks that the answer is grounded and on-topic: ungrounded answers regenerate, and off-topic ones rewrite the query and retrieve again."
    origin:
      by: LangChain
      org: LangChain
      year: 2024
      url: https://www.langchain.com/blog/agentic-rag-with-langgraph
      kind: popularized
      uncertain: true
      note: "No single originator. It combines CRAG's query rewriting with Self-RAG-style checks of the answer for groundedness and relevance; LangChain's 'Self-Reflective RAG with LangGraph' (February 2024) describes this loop."
    build:
      goal: "Answer from retrieved documents, then grade the answer itself: regenerate when it is not grounded in the documents, and rewrite the query and retrieve again when it does not answer the question."
      steps:
        - "Retrieve the top 4 documents for the question and generate an answer from them."
        - "Grade the answer with the {{prompt:answer-grader}}, parsing its JSON into grounded, answers_question and unsupported claims."
        - "If both checks are true, return the answer."
        - "If grounded is false, regenerate from the same documents, passing the unsupported claims to drop or fix."
        - "If grounded is true but answers_question is false, call the {{prompt:rewriter}} for a new query, retrieve again and regenerate."
        - "If the grader's JSON does not parse, retry once; if it fails again, treat the answer as not grounded."
      stop: "Stop when both checks pass, or after 3 loops in total, regenerations and re-retrievals together. At the cap, reply that no supported answer was found and return the last documents."
      requirements:
        - "Make the total loop cap (default 3) and the documents per retrieval (default 4) parameters."
        - "Cap re-retrievals separately (default 2), so a poor index cannot use up every loop. If a retrieval fails or returns nothing, reply that no supported answer was found."
        - "Log each grade with the loop it triggered."
        - "Add a test with a stub grader that returns answers_question=false once and then passes both checks, and a stub rewriter that returns 'payroll vendor contract'; assert two retrievals, the second with the query 'payroll vendor contract', and that the second answer is returned."
    prompts:
      - id: answer-grader
        title: Answer grader prompt
        lang: markdown
        source: |
          Grade an answer against the documents it was written from and the question.

          <question>{{question}}</question>
          <documents>{{docs}}</documents>
          <answer>{{answer}}</answer>

          Respond in JSON:
          {"grounded": true|false, "answers_question": true|false,
           "unsupported_claims": ["claim", "..."]}
          grounded is true only if every claim is stated in the documents.
      - id: rewriter
        title: Query rewriter prompt
        lang: markdown
        source: |
          The answer below did not address the question, so the search missed.

          <question>{{question}}</question>
          <answer>{{answer}}</answer>

          Write one search query that would find the missing facts. Use specific
          terms and names, not the full question. Return only the query.
    diagram:
      nodes:
        - { id: user, kind: io, label: Question, description: "The user's question, e.g. 'Who is our current vendor for payroll?'." }
        - { id: retriever, kind: memory, label: Retriever, description: "The internal index, searched with the question and again with any rewritten query." }
        - { id: generator, kind: llm, label: Generator, description: "Writes the answer from the retrieved documents, and rewrites it when claims are flagged as unsupported." }
        - { id: grader, kind: evaluator, label: Answer grader, description: "Checks the answer twice: are its claims in the documents, and does it answer the question at all?" }
        - { id: rewriter, kind: llm, label: Rewriter, description: "Turns a question the search missed into a sharper query." }
        - { id: out, kind: io, label: Answer, description: "An answer that is both grounded and on the question." }
      edges:
        - { id: ask, from: user, to: retriever, description: "The question is the first search query.", example: "Question: Who is our current vendor for payroll?" }
        - { id: docs, from: retriever, to: generator, style: dashed, label: docs, description: "The top documents go to the generator.", example: "4 docs: \"Payroll runs on the 25th of each month...\", \"Payroll FAQ...\"" }
        - { id: draft, from: generator, to: grader, label: answer, description: "Each answer is graded with the documents it should rest on.", example: "Payroll runs on the 25th of each month." }
        - { id: regen, from: grader, to: generator, style: loop, label: rewrite, description: "If the answer is ungrounded, the claims not found in the documents go back so the generator can drop or fix them.", example: "{\"grounded\": false, \"answers_question\": true, \"unsupported_claims\": [\"on a three-year contract\"]}" }
        - { id: off, from: grader, to: rewriter, label: off-topic, description: "A grounded answer that misses the question means the search missed, so the query is rewritten.", example: "{\"grounded\": true, \"answers_question\": false, \"unsupported_claims\": []}" }
        - { id: requery, from: rewriter, to: retriever, style: loop, label: new query, description: "The rewritten query is searched, and the loop continues with the new documents.", example: "payroll provider contract vendor name 2025" }
        - { id: accept, from: grader, to: out, label: grounded, description: "An answer that passes both checks leaves the loop.", example: "Acme has used Gusto for payroll since March 2025." }
      scenarios:
        - id: off-topic
          label: The first answer misses the question
          steps:
            - id: retrieve
              caption: The question is searched and the documents go to the generator.
              duration: 2000
              events:
                - { type: send, edge: ask, token: { kind: prompt, label: question }, at: [0, 0.4] }
                - { type: read, node: retriever, at: [0.4, 0.6] }
                - { type: send, edge: docs, token: { kind: result, label: 4 docs }, at: [0.6, 1] }
            - id: first-answer
              caption: The answer is grounded but talks about pay dates, not the vendor, so the grader marks it off-topic.
              duration: 3000
              events:
                - { type: activate, node: generator, status: thinking, at: [0, 0.3] }
                - { type: send, edge: draft, token: { kind: result, label: answer }, at: [0.3, 0.55] }
                - { type: activate, node: grader, status: error, at: [0.55, 0.75] }
                - { type: branch, node: grader, taken: off, notTaken: [accept, regen], at: [0.75, 1] }
            - id: rewrite
              caption: The rewriter writes a sharper query and the index is searched again.
              duration: 3000
              events:
                - { type: send, edge: off, token: { kind: feedback, label: off-topic }, at: [0, 0.25] }
                - { type: activate, node: rewriter, status: thinking, at: [0.25, 0.45] }
                - { type: send, edge: requery, token: { kind: tool-call, label: new query }, at: [0.45, 0.7] }
                - { type: read, node: retriever, at: [0.7, 0.85] }
                - { type: send, edge: docs, token: { kind: result, label: contract }, at: [0.85, 1] }
            - id: second-answer
              caption: The new answer names the vendor, every claim is in the documents, and it is returned.
              duration: 2800
              events:
                - { type: activate, node: generator, status: thinking, at: [0, 0.3] }
                - { type: send, edge: draft, token: { kind: result, label: answer }, at: [0.3, 0.55] }
                - { type: branch, node: grader, taken: accept, notTaken: [off, regen], at: [0.55, 0.7] }
                - { type: send, edge: accept, token: { kind: result, label: Gusto }, at: [0.7, 1] }
        - id: ungrounded
          label: An ungrounded claim is dropped
          steps:
            - id: retrieve
              caption: The question is searched and the documents, which include the vendor contract, go to the generator.
              duration: 2000
              events:
                - { type: send, edge: ask, token: { kind: prompt, label: question }, at: [0, 0.4] }
                - { type: read, node: retriever, at: [0.4, 0.6] }
                - { type: send, edge: docs, token: { kind: result, label: 4 docs }, at: [0.6, 1] }
            - id: first-answer
              caption: The answer adds a three-year term that no document states, so the grader marks it ungrounded.
              duration: 3200
              events:
                - { type: activate, node: generator, status: thinking, at: [0, 0.3] }
                - { type: send, edge: draft, token: { kind: result, label: answer }, at: [0.3, 0.55] }
                - { type: branch, node: grader, taken: regen, notTaken: [accept, off], at: [0.55, 0.7] }
                - { type: send, edge: regen, token: { kind: feedback, label: 3-year term }, at: [0.7, 1] }
            - id: second-answer
              caption: The generator drops the unsupported claim from the same documents, and the answer passes both checks.
              duration: 2800
              events:
                - { type: activate, node: generator, status: thinking, at: [0, 0.3] }
                - { type: send, edge: draft, token: { kind: result, label: answer }, at: [0.3, 0.55] }
                - { type: branch, node: grader, taken: accept, notTaken: [off, regen], at: [0.55, 0.7] }
                - { type: send, edge: accept, token: { kind: result, label: Gusto }, at: [0.7, 1] }
