slug: permission-policies
name: Permission Policies
family: safety-oversight
aliases: [Tool allowlists, Allow/ask/deny rules, Budget caps, Least privilege, Policy engine]
summary: "Every tool call is checked against declarative allow, ask and deny rules and a budget before it runs."
badges: { autonomy: medium, cost: low, latency: low }
sources:
  - title: Configure permissions (Claude Code docs, Anthropic)
    url: https://code.claude.com/docs/en/permissions
  - title: A practical guide to building agents (OpenAI, 2025)
    url: https://cdn.openai.com/business-guides-and-resources/a-practical-guide-to-building-agents.pdf
related:
  composesWith: [human-in-the-loop, sandboxed-execution, guardrails, react]
  confusedWith:
    - { slug: human-in-the-loop, difference: "Human-in-the-loop is the approval step itself. A permission policy decides most calls automatically by rule and sends only the ask lane to a person." }
    - { slug: guardrails, difference: "Guardrails check content: the text going in and coming out. A permission policy checks actions: which tool, with which arguments, and what it costs." }
origin:
  by: OpenAI and Anthropic
  org: OpenAI; Anthropic
  year: 2025
  url: https://code.claude.com/docs/en/permissions
  kind: popularized
  uncertain: true
  note: "OpenAI's 2025 agent guide rates each tool's risk to decide when to escalate, and Claude Code ships tiered allow, ask and deny rules. The idea itself is classic least privilege, with no single inventor for agents."
build:
  goal: "Put a policy check between an agent and its tools, so every proposed call is allowed, escalated to a person, or denied by declarative rules, and the run stops when a spend or step budget is used up."
  steps:
    - "Load the policy from a config file: ordered deny, ask and allow rules, each a tool name plus an optional argument pattern, and a budget with a spend cap and a step cap."
    - "Run the agent with the {{prompt:agent}}, which tells it that some calls may be denied or need approval and how to react."
    - "When the agent proposes a tool call, deny it at once if its tool is not declared in the policy. Otherwise match it against the rules in the order deny, then ask, then allow; a declared tool whose arguments match no rule goes to ask."
    - "On allow, run the tool and return its result to the agent. On deny, do not run it; return an error naming the rule that matched, and count the denial as a step toward the step cap."
    - "On ask, send the person a message built from the {{prompt:approval}} and wait up to a timeout (default 10 minutes). Run the tool only if they approve. A rejection, a timeout, or a run with no person attached is a denial, reported to the agent like any other."
    - "Keep one budget meter for the run: add the agent's own model-call spend after each turn and each tool call's estimated cost before it runs. If the next call would pass the spend or step cap, stop the run instead of calling the tool."
    - "Record every decision (the call, the matched rule, the verdict, who approved it and the running spend) in an audit log."
  stop: "Stop when the agent returns a final answer, or when the spend or step cap is reached (denials count as steps). On a cap, return the partial work with a status naming the cap. An unanswered ask never blocks the run: it times out as a denial."
  requirements:
    - "Keep the policy in data (a file or a table), not in prompt text, and never let the agent change it."
    - "Evaluate deny before ask before allow, so a broad allow rule can never override a specific deny."
    - "Fail closed: deny any tool not declared in the policy, send a declared tool with unmatched arguments to ask, and turn an ask that times out or has no person to answer into a deny. Never fall through to allow."
    - "Match rules on the parsed tool name and arguments, not on the raw text, so that 'git status; rm -rf ~' does not match an allow rule for 'git status'."
    - "Test with no approver attached and rules allow 'git status', deny 'rm *', npm declared with no rule: a stub LLM proposes 'git status', 'rm -rf /', 'npm install x' and the unlisted http_post. Assert the shell ran once, three denials came back, and 4 steps were counted."
prompts:
  - id: agent
    title: Agent prompt with a permission policy
    lang: markdown
    source: |
      You are a coding agent working in {{repo}}. Your task:
      <task>{{task}}</task>

      Every tool call you make is checked against a permission policy before it runs.
      - Some calls run at once. Some need a person's approval, so say why you need them;
        if nobody answers in time, the call is denied.
      - Only the tools listed for you exist. Calls to any other tool are denied.
      - A denied call returns an error naming the rule. Do not retry it or try to
        reach the same effect another way; find a different approach or explain
        why the task cannot be finished.
      - The run has a budget of {{budget}}. Prefer cheap, read-only calls first.

      Before each call that changes anything, write one line saying what it will
      change and why it is needed.
  - id: approval
    title: Approval request message
    lang: markdown
    source: |
      **The agent wants to run a call that your policy marks as "ask".**

      Tool: `{{tool_name}}`
      Arguments: `{{arguments}}`
      Matched rule: `{{rule}}`
      Agent's reason: {{rationale}}
      Spent so far: {{spent}} of {{budget}}

      Reply approve or reject within {{timeout}}. A rejection is passed to the agent
      with your reason; no reply in time counts as a rejection.
diagram:
  nodes:
    - id: user
      kind: io
      pos: { x: 0, y: 0 }
      label: Task
      description: "The request that starts the run, such as 'Fix the failing date-parsing test in this repo'."
    - id: agent
      kind: agent
      pos: { x: 210, y: 0 }
      label: Agent
      description: "The coding agent. It proposes tool calls one at a time and reads each result, denial or refusal before its next move."
    - id: policy
      kind: guard
      pos: { x: 440, y: 0 }
      label: Policy
      sublabel: "spent $1.40 of $2"
      description: "Plain code: denies undeclared tools, matches the rest in the order deny, ask, allow, and keeps the run's budget meter, here at $1.40 of $2."
    - id: human
      kind: human
      pos: { x: 680, y: -100 }
      label: Developer
      description: "The person asked about calls in the ask lane only, such as installing a new package. Everything else is decided without them."
    - id: tool
      kind: tool
      pos: { x: 920, y: 0 }
      label: Shell
      description: "The tool that actually runs commands. It only ever receives calls the policy allowed or the developer approved."
    - id: out
      kind: io
      pos: { x: 680, y: 110 }
      label: Result
      description: "The agent's final answer, or a stop report naming the cap that ended the run."
  edges:
    - id: task
      from: user
      to: agent
      description: "The task goes to the agent, which starts proposing tool calls."
      example: "Fix the failing test in tests/date.test.ts without changing its assertions."
    - id: propose
      from: agent
      to: policy
      label: call
      description: "Every tool call the agent proposes goes to the policy first; nothing reaches the shell directly."
      example: '{"tool": "shell", "command": "npm install date-fns@4"}'
    - id: allow
      from: policy
      to: tool
      label: allow
      description: "A call that matches an allow rule, and no deny or ask rule, runs at once with no person involved."
      example: "git status matched allow rule shell(git status); spent $0.02 of $2.00."
    - id: ask
      from: policy
      to: human
      label: ask
      description: "A declared tool whose call matches an ask rule, or no rule, waits for the developer. No answer before the timeout counts as a deny."
      example: "npm install date-fns@4 matched ask rule shell(npm install *). Agent's reason: the parser needs date-fns."
    - id: approve
      from: human
      to: tool
      label: approve
      description: "An approved call goes on to the shell exactly as proposed."
      example: "approve: npm install date-fns@4"
    - id: deny
      from: policy
      to: agent
      style: dashed
      label: deny
      description: "A denied call never runs. The agent gets an error naming the rule, so it can choose another approach."
      example: "Error: shell(rm -rf /) denied by rule shell(rm *). Choose a different approach."
    - id: result
      from: tool
      to: agent
      style: loop
      label: result
      description: "The command's output goes back to the agent, which decides its next call."
      example: "On branch fix/date-parse. Changes not staged: src/date.ts"
    - id: done
      from: agent
      to: out
      description: "When the agent is finished, its answer leaves the loop."
      example: "Fixed: parseDate now handles ISO week dates. tests/date.test.ts passes (14/14)."
    - id: cap
      from: policy
      to: out
      style: dashed
      label: cap hit
      description: "When the next call would pass the spend or step cap, the policy ends the run instead of running it."
      example: "Stopped: spend cap reached ($2.00 of $2.00) after 31 calls. Partial work is on branch fix/date-parse."
  scenarios:
    - id: mixed-calls
      label: Allow, ask and deny
      steps:
        - id: start
          caption: The task reaches the agent, which proposes 'git status'.
          duration: 1600
          events:
            - { type: send, edge: task, token: { kind: prompt, label: task } }
            - { type: activate, node: agent, status: thinking, at: [0.5, 1] }
        - id: allowed
          caption: "'git status' matches an allow rule, so it runs at once and the output goes back to the agent."
          duration: 3000
          events:
            - { type: send, edge: propose, token: { kind: tool-call, label: git status }, at: [0, 0.25] }
            - { type: branch, node: policy, taken: allow, notTaken: [ask, deny, cap], at: [0.25, 0.4] }
            - { type: send, edge: allow, token: { kind: tool-call, label: git status }, at: [0.4, 0.6] }
            - { type: activate, node: tool, status: calling, at: [0.6, 0.75] }
            - { type: send, edge: result, token: { kind: result, label: output }, at: [0.75, 1] }
        - id: asked
          caption: "'npm install' matches an ask rule. The developer approves it, and only then does it run."
          duration: 4000
          events:
            - { type: send, edge: propose, token: { kind: tool-call, label: npm install }, at: [0, 0.18] }
            - { type: branch, node: policy, taken: ask, notTaken: [allow, deny, cap], at: [0.18, 0.3] }
            - { type: send, edge: ask, token: { kind: prompt, label: approve? }, at: [0.3, 0.45] }
            - { type: activate, node: human, status: waiting, at: [0.45, 0.65] }
            - { type: send, edge: approve, token: { kind: tool-call, label: npm install }, at: [0.65, 0.8] }
            - { type: send, edge: result, token: { kind: result, label: installed }, at: [0.8, 1] }
        - id: denied
          caption: "'rm -rf /' matches a deny rule. It never runs; the agent gets an error naming the rule."
          duration: 3000
          events:
            - { type: send, edge: propose, token: { kind: tool-call, label: rm -rf / }, at: [0, 0.3] }
            - { type: branch, node: policy, taken: deny, notTaken: [allow, ask, cap], at: [0.3, 0.45] }
            - { type: activate, node: policy, status: error, at: [0.4, 0.6] }
            - { type: send, edge: deny, token: { kind: feedback, label: denied }, at: [0.55, 0.9] }
            - { type: activate, node: agent, status: thinking, at: [0.85, 1] }
        - id: finish
          caption: The agent fixes the bug with the calls it was allowed and returns its answer.
          duration: 1800
          events:
            - { type: send, edge: done, token: { kind: result, label: fixed }, at: [0, 0.8] }
            - { type: activate, node: out, status: done, at: [0.7, 1] }
    - id: budget-exhausted
      label: Budget cap reached
      steps:
        - id: start
          caption: The task reaches the agent, which starts calling allowed tools.
          duration: 1400
          events:
            - { type: send, edge: task, token: { kind: prompt, label: task } }
        - id: spend
          caption: Each allowed call runs and adds its cost to the budget meter.
          duration: 2600
          repeat: 3
          events:
            - { type: send, edge: propose, token: { kind: tool-call, label: npm test }, at: [0, 0.3] }
            - { type: branch, node: policy, taken: allow, notTaken: [ask, deny, cap], at: [0.3, 0.45] }
            - { type: send, edge: allow, token: { kind: tool-call, label: npm test }, at: [0.45, 0.7] }
            - { type: send, edge: result, token: { kind: result, label: 1 failing }, at: [0.7, 1] }
        - id: capped
          caption: The next call would pass the $2 cap, so the policy stops the run and reports the partial work.
          duration: 3000
          events:
            - { type: send, edge: propose, token: { kind: tool-call, label: npm test }, at: [0, 0.3] }
            - { type: branch, node: policy, taken: cap, notTaken: [allow, ask, deny], at: [0.3, 0.45] }
            - { type: activate, node: policy, status: error, at: [0.4, 0.6] }
            - { type: send, edge: cap, token: { kind: result, label: cap reached }, at: [0.55, 0.9] }
            - { type: activate, node: out, status: done, at: [0.85, 1] }
