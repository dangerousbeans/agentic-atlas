slug: chain-of-verification
name: Chain-of-Verification
family: reasoning-prompting
aliases: [CoVe, Factored verification, Draft-verify-revise]
summary: Draft an answer, plan questions that check its claims, answer each one without seeing the draft, then rewrite the answer to match.
badges: { autonomy: low, cost: high, latency: high }
sources:
  - title: "Chain-of-Verification Reduces Hallucination in Large Language Models (Dhuliawala et al., 2023)"
    url: https://arxiv.org/abs/2309.11495
related:
  composesWith: [chain-of-thought, sectioning]
  confusedWith:
    - { slug: evaluator-optimizer, difference: "Evaluator-optimizer loops until a judge passes the work; chain-of-verification makes one pass and checks claims with independent questions, not a verdict." }
    - { slug: corrective-rag, difference: "Corrective RAG grades retrieved documents before answering; chain-of-verification checks the model's own claims after it has answered." }
origin:
  by: Shehzaad Dhuliawala et al.
  org: Meta AI, ETH Zürich
  year: 2023
  url: https://arxiv.org/abs/2309.11495
  kind: introduced
  note: "The paper compares four ways to run the verification step: joint, two-step, factored and factor+revise. Both factored (shown first here) and two-step beat joint, and factor+revise raised the FActScore on biographies from 63.7 to 71.4."
defaultVariantName: Factored
build:
  goal: "Reduce made-up facts in an answer by checking each of its claims with a separate question the model answers without seeing the answer, then rewriting the answer to agree with those checks."
  steps:
    - "Call the model with the {{prompt:draft}} to write a baseline answer to the user's question."
    - "Call the model with the {{prompt:plan}}, passing the question and the draft, and parse one verification question per line."
    - "Answer every verification question in its own call with the {{prompt:verify}}. Pass only that question: never the draft, the user's question or the other checks. Run these calls in parallel."
    - "Call the model with the {{prompt:revise}}, passing the question, the draft and every verification question with its answer."
    - "Return the revised answer, and keep the verification questions and answers alongside it for logs and review."
  stop: "Stop after the revise call: the pattern makes one pass and never loops. If the plan produces no questions, return the draft unchanged with a status saying nothing was checked."
  requirements:
    - "Never include the draft in a verify call; build those prompts from the verification question alone, so a hallucination cannot be copied into its own check."
    - "Cap the verification questions (default 10) and run the verify calls concurrently with a configurable limit."
    - "Keep each verification question and answer paired, in plan order, when passing them to the revise prompt."
    - "Log the draft, the plan, every check and the revised answer, so a removed claim can be traced to the check that removed it."
    - "Add a test with a stub LLM: draft 'Hillary Clinton, Donald Trump, Theodore Roosevelt', checks answer Chicago, Queens, Manhattan; assert three verify calls, none containing the draft, and that the revise prompt contains 'Chicago'."
prompts:
  - id: draft
    title: Draft prompt
    lang: markdown
    source: |
      Answer the question.

      <question>{{question}}</question>
  - id: plan
    title: Plan verification prompt
    lang: markdown
    source: |
      Below is a question and a draft answer. Write questions that check each
      factual claim in the draft. Each question must make sense on its own,
      without the draft, and must be answerable with a short fact.

      <question>{{question}}</question>
      <draft>{{draft}}</draft>

      Write one verification question per line, and nothing else.
  - id: verify
    title: Verification prompt
    lang: markdown
    source: |
      Answer the question with a short, factual answer. If you are not sure,
      say "unsure".

      <question>{{verification_question}}</question>
  - id: revise
    title: Revise prompt
    lang: markdown
    source: |
      Below is a question, a draft answer, and checks of the draft's claims that
      were answered independently. Rewrite the answer so it agrees with the checks.
      Remove any claim a check contradicts, and add nothing the checks do not support.

      <question>{{question}}</question>
      <draft>{{draft}}</draft>
      <checks>
      {{#each checks}}
      Q: {{question}}
      A: {{answer}}
      {{/each}}
      </checks>

      Return only the revised answer.
diagram:
  groups:
    - { id: isolated, label: Never shown the draft, children: [v1, v2, v3] }
  nodes:
    - id: question
      kind: io
      label: Question
      description: "A question whose answer is a list of facts: 'Name some politicians who were born in New York City.'"
    - id: drafter
      kind: llm
      label: Draft + plan
      sublabel: two calls
      description: "Writes a baseline answer the usual way, then reads it and writes one stand-alone question per claim."
    - id: v1
      kind: llm
      label: Check 1
      sublabel: answered alone
      description: "Answers the first verification question in its own call. It sees only that question, so it cannot copy the draft's claim."
    - id: v2
      kind: llm
      label: Check 2
      sublabel: answered alone
      description: "Answers the second verification question in a separate call, with no draft and no other checks in view."
    - id: v3
      kind: llm
      label: Check 3
      sublabel: answered alone
      description: "Answers the third verification question in its own call. All the checks can run in parallel."
    - id: reviser
      kind: llm
      label: Revise
      description: "Compares the draft with the checks' answers and rewrites it, dropping any claim a check contradicts."
    - id: answer
      kind: io
      label: Answer
      description: "The revised answer, which keeps only the claims that the independent checks support."
  edges:
    - id: ask
      from: question
      to: drafter
      description: "The question goes to the model for a first, unchecked answer."
      example: "Name some politicians who were born in New York City."
    - id: q1
      from: drafter
      to: v1
      description: "The first verification question goes out on its own. The draft itself stays behind."
      example: "Where was Hillary Clinton born?"
    - id: q2
      from: drafter
      to: v2
      description: "The second verification question goes out in parallel, again without the draft."
      example: "Where was Donald Trump born?"
    - id: q3
      from: drafter
      to: v3
      description: "The third verification question goes out in parallel with the others."
      example: "Where was Theodore Roosevelt born?"
    - id: a1
      from: v1
      to: reviser
      description: "The first check's answer, given with no idea what the draft claimed."
      example: "Hillary Clinton was born in Chicago, Illinois."
    - id: a2
      from: v2
      to: reviser
      description: "The second check's answer goes to the reviser."
      example: "Donald Trump was born in Queens, New York City."
    - id: a3
      from: v3
      to: reviser
      description: "The third check's answer goes to the reviser."
      example: "Theodore Roosevelt was born in Manhattan, New York City."
    - id: carry
      from: drafter
      to: reviser
      style: dashed
      label: draft
      description: "The draft goes straight to the reviser, bypassing the checks, so it can be compared with their answers."
      example: "Hillary Clinton, Donald Trump and Theodore Roosevelt were all born in New York City."
    - id: final
      from: reviser
      to: answer
      label: revised
      description: "The rewritten answer, with every contradicted claim removed."
      example: "Donald Trump (born in Queens) and Theodore Roosevelt (born in Manhattan)."
  scenarios:
    - id: catches-hallucination
      label: Catches a made-up claim
      steps:
        - id: draft
          caption: The model drafts an answer naming three politicians; one of them was not born in New York.
          duration: 2000
          events:
            - { type: send, edge: ask, token: { kind: prompt, label: question }, at: [0, 0.4] }
            - { type: activate, node: drafter, status: thinking, at: [0.4, 1] }
        - id: plan
          caption: A second call reads the draft and turns each claim into a stand-alone question about one person's birthplace.
          duration: 2400
          events:
            - { type: activate, node: drafter, status: thinking, at: [0, 0.4] }
            - { type: send, edge: q1, token: { kind: prompt, label: Clinton? }, at: [0.4, 0.9] }
            - { type: send, edge: q2, token: { kind: prompt, label: Trump? }, at: [0.4, 0.9] }
            - { type: send, edge: q3, token: { kind: prompt, label: Roosevelt? }, at: [0.4, 0.9] }
        - id: check
          caption: Each check answers its question alone, without the draft. Check 1 says Clinton was born in Chicago.
          duration: 3000
          events:
            - { type: activate, node: v1, status: error, at: [0, 0.5] }
            - { type: activate, node: v2, status: thinking, at: [0, 0.4] }
            - { type: activate, node: v3, status: thinking, at: [0, 0.45] }
            - { type: send, edge: a1, token: { kind: feedback, label: Chicago }, at: [0.5, 0.9] }
            - { type: send, edge: a2, token: { kind: result, label: Queens }, at: [0.45, 0.85] }
            - { type: send, edge: a3, token: { kind: result, label: Manhattan }, at: [0.5, 0.9] }
            - { type: send, edge: carry, token: { kind: result, label: draft }, at: [0.3, 0.9] }
        - id: revise
          caption: The reviser sees that Chicago contradicts the draft, drops Clinton, and returns the two names that hold up.
          duration: 2600
          events:
            - { type: activate, node: reviser, status: thinking, at: [0, 0.5] }
            - { type: send, edge: final, token: { kind: result, label: 2 names }, at: [0.5, 0.9] }
            - { type: activate, node: answer, status: done, at: [0.85, 1] }
    - id: all-verified
      label: Every claim holds
      steps:
        - id: draft
          caption: This time the draft names Donald Trump, Theodore Roosevelt and Alexandria Ocasio-Cortez.
          duration: 2000
          events:
            - { type: send, edge: ask, token: { kind: prompt, label: question }, at: [0, 0.4] }
            - { type: activate, node: drafter, status: thinking, at: [0.4, 1] }
        - id: plan
          caption: A second call writes one birthplace question per name.
          duration: 2400
          events:
            - { type: activate, node: drafter, status: thinking, at: [0, 0.4] }
            - { type: send, edge: q1, token: { kind: prompt, label: Trump? }, at: [0.4, 0.9] }
            - { type: send, edge: q2, token: { kind: prompt, label: Roosevelt? }, at: [0.4, 0.9] }
            - { type: send, edge: q3, token: { kind: prompt, label: Ocasio-Cortez? }, at: [0.4, 0.9] }
        - id: check
          caption: "Every independent check places its politician in New York City: Queens, Manhattan and the Bronx."
          duration: 3000
          events:
            - { type: activate, node: v1, status: thinking, at: [0, 0.45] }
            - { type: activate, node: v2, status: thinking, at: [0, 0.4] }
            - { type: activate, node: v3, status: thinking, at: [0, 0.5] }
            - { type: send, edge: a1, token: { kind: result, label: Queens }, at: [0.45, 0.85] }
            - { type: send, edge: a2, token: { kind: result, label: Manhattan }, at: [0.4, 0.8] }
            - { type: send, edge: a3, token: { kind: result, label: Bronx }, at: [0.5, 0.9] }
            - { type: send, edge: carry, token: { kind: result, label: draft }, at: [0.3, 0.9] }
        - id: revise
          caption: Nothing contradicts the draft, so the reviser returns it unchanged.
          duration: 2200
          events:
            - { type: activate, node: reviser, status: thinking, at: [0, 0.4] }
            - { type: send, edge: final, token: { kind: result, label: unchanged }, at: [0.4, 0.85] }
            - { type: activate, node: answer, status: done, at: [0.8, 1] }
variants:
  - id: joint
    name: Joint
    summary: "One prompt both plans the checks and answers them, with the draft in view. Cheapest, but the answers tend to repeat the draft's mistakes."
    build:
      goal: "Check a draft's claims with the fewest calls: one call writes the verification questions and answers them, then a second rewrites the draft."
      steps:
        - "Call the model with the {{prompt:draft}} to write a baseline answer."
        - "Call the model with the {{prompt:joint}}, passing the question and the draft. It writes each verification question followed by its answer."
        - "Parse the reply into question and answer pairs."
        - "Call the model with the {{prompt:revise}}, passing the question, the draft and the pairs, and return the revised answer."
      stop: "Stop after the revise call; the pattern makes one pass. If no pairs can be parsed, return the draft with a status saying nothing was checked."
      requirements:
        - "Parse pairs strictly as alternating 'Q:' and 'A:' lines, and skip a question with no answer."
        - "Log the joint reply in full; it is the only record of what was checked."
        - "Measure how often the checks agree with the draft; if they almost always do, switch to the factored form."
        - "Add a test with a stub LLM whose joint reply has three Q and A pairs; assert exactly three model calls and that the revise prompt contains all three answers."
    prompts:
      - id: draft
        title: Draft prompt
        lang: markdown
        source: |
          Answer the question.

          <question>{{question}}</question>
      - id: joint
        title: Plan and answer prompt
        lang: markdown
        source: |
          Below is a question and a draft answer. For each factual claim in the
          draft, write a question that checks it, then answer that question.

          <question>{{question}}</question>
          <draft>{{draft}}</draft>

          Use this format, one pair per claim:
          Q: <verification question>
          A: <short factual answer>
      - id: revise
        title: Revise prompt
        lang: markdown
        source: |
          Below is a question, a draft answer, and checks of the draft's claims.
          Rewrite the answer so it agrees with the checks. Remove any claim a
          check contradicts, and add nothing the checks do not support.

          <question>{{question}}</question>
          <draft>{{draft}}</draft>
          <checks>{{checks}}</checks>

          Return only the revised answer.
    diagram:
      nodes:
        - id: question
          kind: io
          label: Question
          description: "A question whose answer is a list of facts: 'Name some politicians who were born in New York City.'"
        - id: drafter
          kind: llm
          label: Draft
          description: "Writes a baseline answer the usual way. It may contain made-up or wrong facts."
        - id: joint
          kind: llm
          label: Plan + answer
          sublabel: draft in view
          description: "Writes the verification questions and answers them in the same reply, with the draft in front of it."
        - id: reviser
          kind: llm
          label: Revise
          description: "Rewrites the draft to agree with the checks. It can only remove what the checks contradict."
        - id: answer
          kind: io
          label: Answer
          description: "The revised answer. If the checks copied the draft's mistake, the mistake survives."
      edges:
        - id: ask
          from: question
          to: drafter
          description: "The question goes to the model for a first, unchecked answer."
          example: "Name some politicians who were born in New York City."
        - id: draft
          from: drafter
          to: joint
          description: "The draft goes to the joint step, which reads it while writing and answering the checks."
          example: "Hillary Clinton, Donald Trump and Theodore Roosevelt were all born in New York City."
        - id: checks
          from: joint
          to: reviser
          label: Q and A
          description: "The questions and their answers, written in one reply right after reading the draft."
          example: "Q: Where was Hillary Clinton born? A: New York City. Q: Where was Donald Trump born? A: Queens, New York City."
        - id: carry
          from: drafter
          to: reviser
          style: dashed
          label: draft
          description: "The draft also goes straight to the reviser, so it can be compared with the checks."
          example: "Hillary Clinton, Donald Trump and Theodore Roosevelt were all born in New York City."
        - id: final
          from: reviser
          to: answer
          label: revised
          description: "The rewritten answer, which can only be as good as the checks behind it."
          example: "Hillary Clinton, Donald Trump and Theodore Roosevelt were all born in New York City."
      scenarios:
        - id: repeats-mistake
          label: The check repeats the mistake
          steps:
            - id: draft
              caption: The model drafts three names; Hillary Clinton was actually born in Chicago.
              duration: 2400
              events:
                - { type: send, edge: ask, token: { kind: prompt, label: question }, at: [0, 0.35] }
                - { type: activate, node: drafter, status: thinking, at: [0.35, 0.7] }
                - { type: send, edge: draft, token: { kind: result, label: 3 names }, at: [0.7, 1] }
            - id: joint
              caption: With the draft in view, the joint step answers 'Where was Clinton born?' with 'New York City', copying the error.
              duration: 3000
              events:
                - { type: activate, node: joint, status: thinking, at: [0, 0.5] }
                - { type: send, edge: checks, token: { kind: feedback, label: all agree }, at: [0.5, 0.9] }
                - { type: send, edge: carry, token: { kind: result, label: draft }, at: [0.4, 0.9] }
            - id: revise
              caption: The checks agree with the draft, so the reviser keeps all three names and the made-up claim survives.
              duration: 2600
              events:
                - { type: activate, node: reviser, status: thinking, at: [0, 0.5] }
                - { type: send, edge: final, token: { kind: result, label: 3 names }, at: [0.5, 0.9] }
                - { type: activate, node: answer, status: error, at: [0.85, 1] }
  - id: two-step
    name: Two-step
    summary: "One call plans the checks with the draft in view; a second call answers them all together without it."
    build:
      goal: "Check a draft's claims in two calls, keeping the draft out of the call that answers the checks, then rewrite the draft to match."
      steps:
        - "Call the model with the {{prompt:draft}} to write a baseline answer."
        - "Call the model with the {{prompt:plan}}, passing the question and the draft, and parse one verification question per line."
        - "Call the model once with the {{prompt:verify-all}}, passing only the list of verification questions. It must not see the draft."
        - "Parse the numbered answers and pair each with its question."
        - "Call the model with the {{prompt:revise}}, passing the question, the draft and the pairs, and return the revised answer."
      stop: "Stop after the revise call; the pattern makes one pass. If the plan produces no questions, return the draft with a status saying nothing was checked."
      requirements:
        - "Never include the draft or the user's question in the verify-all call."
        - "Number the verification questions and require numbered answers, so each answer can be matched to its question."
        - "Cap the verification questions (default 10)."
        - "Add a test with a stub LLM: draft three names, plan three questions, answers 'Chicago', 'Queens', 'Manhattan'; assert four model calls and that the verify-all prompt does not contain the draft."
    prompts:
      - id: draft
        title: Draft prompt
        lang: markdown
        source: |
          Answer the question.

          <question>{{question}}</question>
      - id: plan
        title: Plan verification prompt
        lang: markdown
        source: |
          Below is a question and a draft answer. Write questions that check each
          factual claim in the draft. Each question must make sense on its own,
          without the draft, and must be answerable with a short fact.

          <question>{{question}}</question>
          <draft>{{draft}}</draft>

          Write one verification question per line, and nothing else.
      - id: verify-all
        title: Answer all checks prompt
        lang: markdown
        source: |
          Answer each question with a short, factual answer. If you are not sure,
          say "unsure". Number your answers to match the questions.

          {{#each questions}}
          {{@index}}. {{this}}
          {{/each}}
      - id: revise
        title: Revise prompt
        lang: markdown
        source: |
          Below is a question, a draft answer, and checks of the draft's claims that
          were answered without seeing the draft. Rewrite the answer so it agrees
          with the checks. Remove any claim a check contradicts.

          <question>{{question}}</question>
          <draft>{{draft}}</draft>
          <checks>{{checks}}</checks>

          Return only the revised answer.
    diagram:
      nodes:
        - id: question
          kind: io
          label: Question
          description: "A question whose answer is a list of facts: 'Name some politicians who were born in New York City.'"
        - id: drafter
          kind: llm
          label: Draft + plan
          sublabel: two calls
          description: "Writes a baseline answer the usual way, then reads it and writes one stand-alone question per claim."
        - id: answerer
          kind: llm
          label: Answer checks
          sublabel: all Qs, no draft
          description: "Answers every verification question in one call. It never sees the draft, but it does see the other questions."
        - id: reviser
          kind: llm
          label: Revise
          description: "Compares the draft with the answers and rewrites it, dropping any claim they contradict."
        - id: answer
          kind: io
          label: Answer
          description: "The revised answer, keeping only the claims the checks support."
      edges:
        - id: ask
          from: question
          to: drafter
          description: "The question goes to the model for a first, unchecked answer."
          example: "Name some politicians who were born in New York City."
        - id: questions
          from: drafter
          to: answerer
          label: questions
          description: "Only the list of questions crosses over; the draft stays behind."
          example: "1. Where was Hillary Clinton born? 2. Where was Donald Trump born? 3. Where was Theodore Roosevelt born?"
        - id: answers
          from: answerer
          to: reviser
          label: answers
          description: "The numbered answers go to the reviser, each matched to its question."
          example: "1. Chicago, Illinois. 2. Queens, New York City. 3. Manhattan, New York City."
        - id: carry
          from: drafter
          to: reviser
          style: dashed
          label: draft
          description: "The draft goes straight to the reviser, bypassing the checks, so it can be compared with their answers."
          example: "Hillary Clinton, Donald Trump and Theodore Roosevelt were all born in New York City."
        - id: final
          from: reviser
          to: answer
          label: revised
          description: "The rewritten answer, with every contradicted claim removed."
          example: "Donald Trump (born in Queens) and Theodore Roosevelt (born in Manhattan)."
      scenarios:
        - id: catches-hallucination
          label: Catches a made-up claim
          steps:
            - id: draft
              caption: The model drafts three names; one of them was not born in New York.
              duration: 2000
              events:
                - { type: send, edge: ask, token: { kind: prompt, label: question }, at: [0, 0.4] }
                - { type: activate, node: drafter, status: thinking, at: [0.4, 1] }
            - id: plan
              caption: A second call writes three birthplace questions, and only the questions are passed on.
              duration: 2400
              events:
                - { type: activate, node: drafter, status: thinking, at: [0, 0.45] }
                - { type: send, edge: questions, token: { kind: prompt, label: 3 questions }, at: [0.45, 0.95] }
            - id: answer
              caption: One call answers all three without the draft, and says Clinton was born in Chicago.
              duration: 2800
              events:
                - { type: activate, node: answerer, status: thinking, at: [0, 0.5] }
                - { type: send, edge: answers, token: { kind: feedback, label: "Chicago, ..." }, at: [0.5, 0.95] }
                - { type: send, edge: carry, token: { kind: result, label: draft }, at: [0.4, 0.95] }
            - id: revise
              caption: The reviser drops Clinton and returns the two names that hold up.
              duration: 2400
              events:
                - { type: activate, node: reviser, status: thinking, at: [0, 0.5] }
                - { type: send, edge: final, token: { kind: result, label: 2 names }, at: [0.5, 0.9] }
                - { type: activate, node: answer, status: done, at: [0.85, 1] }
  - id: factor-revise
    name: Factor + revise
    summary: "Factored checks, plus an explicit cross-check that compares each check's answer with the draft's claim before the rewrite."
    build:
      goal: "Check each claim of a draft with an independent question, then explicitly mark each claim as consistent or not before rewriting the draft from those verdicts."
      steps:
        - "Call the model with the {{prompt:draft}} to write a baseline answer, then with the {{prompt:plan}} to get one verification question per line."
        - "Answer every verification question in its own call with the {{prompt:verify}}, passing only that question, in parallel."
        - "For each claim, call the model with the {{prompt:cross-check}}, passing the original claim and the check's question and answer, and parse CONSISTENT, INCONSISTENT or UNSURE."
        - "Call the model with the {{prompt:revise}}, passing the question, the draft and every claim with its verdict and evidence."
        - "Return the revised answer together with the per-claim verdicts."
      stop: "Stop after the revise call; the pattern makes one pass. If the plan produces no questions, return the draft with a status saying nothing was checked."
      requirements:
        - "Never include the draft in a verify call; the cross-check is the only step that sees a claim next to its check."
        - "Give each cross-check exactly one claim, so verdicts cannot bleed between claims."
        - "Treat a reply that is not exactly one of the three verdicts as UNSURE, and keep such claims only if the revise prompt says to."
        - "Cap the verification questions (default 10), and run the verify and cross-check calls concurrently with a limit."
        - "Add a test with a stub LLM where the Clinton cross-check returns INCONSISTENT and the others CONSISTENT; assert the revise prompt marks exactly one claim INCONSISTENT."
    prompts:
      - id: draft
        title: Draft prompt
        lang: markdown
        source: |
          Answer the question.

          <question>{{question}}</question>
      - id: plan
        title: Plan verification prompt
        lang: markdown
        source: |
          Below is a question and a draft answer. Write questions that check each
          factual claim in the draft. Each question must make sense on its own,
          without the draft, and must be answerable with a short fact.

          <question>{{question}}</question>
          <draft>{{draft}}</draft>

          Write one verification question per line, and nothing else.
      - id: verify
        title: Verification prompt
        lang: markdown
        source: |
          Answer the question with a short, factual answer. If you are not sure,
          say "unsure".

          <question>{{verification_question}}</question>
      - id: cross-check
        title: Cross-check prompt
        lang: markdown
        source: |
          Does the evidence support the claim?

          <claim>{{claim}}</claim>
          <evidence>
          Q: {{verification_question}}
          A: {{verification_answer}}
          </evidence>

          Reply with exactly one word: CONSISTENT, INCONSISTENT or UNSURE.
      - id: revise
        title: Revise prompt
        lang: markdown
        source: |
          Below is a question, a draft answer, and a verdict on each of its claims.
          Rewrite the answer: keep CONSISTENT claims, remove INCONSISTENT ones,
          and keep UNSURE claims only if you can hedge them clearly.

          <question>{{question}}</question>
          <draft>{{draft}}</draft>
          <verdicts>{{claims_with_verdicts}}</verdicts>

          Return only the revised answer.
    diagram:
      nodes:
        - id: question
          kind: io
          label: Question
          description: "A question whose answer is a list of facts: 'Name some politicians who were born in New York City.'"
        - id: drafter
          kind: llm
          label: Draft + plan
          description: "Writes a baseline answer, then a stand-alone question for each of its claims (two calls)."
        - id: checks
          kind: llm
          label: Checks
          sublabel: one call per question
          description: "Answers each verification question in its own call, never seeing the draft, as in the factored form."
        - id: crosscheck
          kind: evaluator
          label: Cross-check
          sublabel: claim vs evidence
          description: "Puts each draft claim next to its check's answer and labels it CONSISTENT, INCONSISTENT or UNSURE."
        - id: reviser
          kind: llm
          label: Revise
          description: "Rewrites the draft from the verdicts: keeps consistent claims and removes inconsistent ones."
        - id: answer
          kind: io
          label: Answer
          description: "The revised answer, with a verdict on record for every claim."
      edges:
        - id: ask
          from: question
          to: drafter
          description: "The question goes to the model for a first answer and its verification questions."
          example: "Name some politicians who were born in New York City."
        - id: questions
          from: drafter
          to: checks
          label: questions
          description: "Only the verification questions go to the checks; the draft stays behind."
          example: "Where was Hillary Clinton born? / Where was Donald Trump born? / Where was Theodore Roosevelt born?"
        - id: evidence
          from: checks
          to: crosscheck
          label: answers
          description: "Each check's answer, given without knowing the draft, goes to the cross-check as evidence."
          example: "Hillary Clinton was born in Chicago, Illinois."
        - id: claims
          from: drafter
          to: crosscheck
          style: dashed
          label: claims
          description: "The draft's claims go to the cross-check, one at a time, to be set against their evidence."
          example: "Claim: Hillary Clinton was born in New York City."
        - id: verdicts
          from: crosscheck
          to: reviser
          label: verdicts
          description: "A verdict for each claim, with the evidence behind it, goes to the reviser."
          example: "Clinton: INCONSISTENT (born in Chicago). Trump: CONSISTENT. Roosevelt: CONSISTENT."
        - id: final
          from: reviser
          to: answer
          label: revised
          description: "The rewritten answer, with every inconsistent claim removed."
          example: "Donald Trump (born in Queens) and Theodore Roosevelt (born in Manhattan)."
      scenarios:
        - id: marks-inconsistent
          label: Marks a claim inconsistent
          steps:
            - id: draft
              caption: The model drafts three names and writes a birthplace question for each.
              duration: 2600
              events:
                - { type: send, edge: ask, token: { kind: prompt, label: question }, at: [0, 0.3] }
                - { type: activate, node: drafter, status: thinking, at: [0.3, 0.65] }
                - { type: send, edge: questions, token: { kind: prompt, label: 3 questions }, at: [0.65, 1] }
            - id: check
              caption: Each question is answered alone; the Clinton check says Chicago.
              duration: 2600
              events:
                - { type: activate, node: checks, status: thinking, at: [0, 0.5] }
                - { type: send, edge: evidence, token: { kind: result, label: 3 answers }, at: [0.5, 0.95] }
                - { type: send, edge: claims, token: { kind: result, label: 3 claims }, at: [0.4, 0.95] }
            - id: cross
              caption: The cross-check sets each claim against its evidence and marks Clinton INCONSISTENT.
              duration: 2600
              events:
                - { type: activate, node: crosscheck, status: thinking, at: [0, 0.5] }
                - { type: send, edge: verdicts, token: { kind: feedback, label: 1 inconsistent }, at: [0.5, 0.95] }
            - id: revise
              caption: The reviser drops the inconsistent claim and returns the two names that hold up.
              duration: 2400
              events:
                - { type: activate, node: reviser, status: thinking, at: [0, 0.5] }
                - { type: send, edge: final, token: { kind: result, label: 2 names }, at: [0.5, 0.9] }
                - { type: activate, node: answer, status: done, at: [0.85, 1] }
