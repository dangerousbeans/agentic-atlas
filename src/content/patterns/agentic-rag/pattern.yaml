slug: agentic-rag
name: Agentic RAG
family: knowledge-memory
aliases: [Retrieval agent, Tool-based retrieval]
summary: The agent decides whether to retrieve, from which source, and with what rewritten query, and repeats until it has enough context.
badges: { autonomy: medium, cost: medium, latency: medium }
sources:
  - title: "Agentic Retrieval-Augmented Generation: A Survey on Agentic RAG (Singh et al., 2025)"
    url: https://arxiv.org/abs/2501.09136
related:
  composesWith: [routing]
  confusedWith: []
origin:
  by: Aditi Singh et al.
  org: Cleveland State University, Kent State University, Northeastern University, University of Agder
  year: 2025
  url: https://arxiv.org/abs/2501.09136
  kind: popularized
  uncertain: true
  note: "This survey systematizes agentic RAG but does not coin it; the term was in use before it, and no single originator was found."
build:
  goal: "Answer a question by letting a model decide, hop by hop, whether to search, which source to search and with what rewritten query, until the context it has gathered is enough for a cited answer."
  steps:
    - "Describe each source (vector index, web search, SQL) in one line, and keep a table from each source name to the function that searches it."
    - "Call the model with the {{prompt:agent}}, filling in the question, the context gathered so far (empty at first) and the source descriptions, and parse its JSON step."
    - "If action is answer, return the answer with its citations."
    - "If action is search, look up the named source in the table, run the rewritten query, and append the top results to the context, each tagged with its source."
    - "If the JSON does not parse or names an unknown source, retry the call once with the error appended; if it fails again, answer from the context so far."
    - "If a search fails or times out, append a note saying that source failed, so the model can choose another, and loop."
  stop: "Stop when the model answers, or after 4 search hops. At the cap, call the model once more with search removed from the allowed actions and return that answer, flagged as having hit the hop limit."
  requirements:
    - "Make the hop cap (default 4) and the results per search (default 3 chunks or rows) parameters."
    - "Route with plain code, never a model call: the model names the source and the table dispatches the query."
    - "Give the SQL source a read-only connection, a timeout and a row limit."
    - "Log every hop: the chosen source, the rewritten query and the ids of the results."
    - "Add a test with a stub LLM that searches vectordb, then web, then answers; assert one call to each of those two backends, none to SQL, and that the answer cites the web result."
defaultVariantName: Source router
prompts:
  - id: agent
    title: Retrieval agent prompt
    lang: markdown
    source: |
      You answer the user's question. You may search before answering.

      <question>{{question}}</question>
      <context_so_far>{{context}}</context_so_far>

      Sources you can search: {{source_descriptions}}

      Decide the next step. Respond in JSON:
      {"action": "search" | "answer",
       "source": "<one of the sources>",
       "query": "a standalone search query, rewritten for that source",
       "answer": "only when action is answer; cite the context you used"}
      Answer as soon as the context is enough. Never invent facts that are not in the context.
diagram:
  nodes:
    - { id: user, kind: io, label: Question, description: "The user's question, e.g. 'What is our current parental leave policy?', which starts the retrieval loop." }
    - { id: agent, kind: llm, label: Agent, description: "Each hop it decides to search or answer, picks a source and rewrites the query; answers once context suffices." }
    - { id: router, kind: router, label: Source router, model: false, description: "Plain code: looks up step.source in the SOURCES table and forwards the rewritten query to that backend." }
    - { id: vectordb, kind: memory, label: Vector DB, description: "Internal document index. Returns the top matching chunks for the agent's rewritten query." }
    - { id: web, kind: tool, label: Web search, description: "Live web search, used when internal chunks are stale or missing the answer. Returns snippets." }
    - { id: sql, kind: tool, label: SQL, description: "Structured database the agent can query for exact figures, via run_query on a generated query." }
    - { id: out, kind: io, label: Answer, description: "The final cited answer, written once the agent judges its context sufficient." }
  edges:
    - { id: ask, from: user, to: agent, description: "The user's question enters the agent, along with any context gathered so far (empty on hop one).", example: "Question: What is our current parental leave policy for new hires?" }
    - { id: plan, from: agent, to: router, description: "The agent's chosen step: which source to search and the query rewritten for that source.", example: "{\"action\": \"search\", \"source\": \"vectordb\", \"query\": \"parental leave policy 2025 new hires\"}" }
    - { id: to-vec, from: router, to: vectordb, description: "The router forwards the standalone query to the vector database when the agent picked vectordb.", example: "search_vectors(\"parental leave policy 2025 new hires\")" }
    - { id: to-web, from: router, to: web, description: "The router forwards the query to web search when the agent picked web.", example: "search_web(\"company parental leave policy update 2026\")" }
    - { id: to-sql, from: router, to: sql, description: "The router forwards a query to the SQL source when the agent picked sql.", example: "run_query(\"SELECT leave_weeks FROM policies WHERE type = 'parental'\")" }
    - { id: vec-back, from: vectordb, to: agent, style: dashed, description: "Retrieved chunks are appended to the agent's context for the next hop.", example: "3 chunks: \"HR Handbook v3 (2023): 12 weeks paid parental leave...\" (out of date)" }
    - { id: web-back, from: web, to: agent, style: dashed, description: "Web snippets are appended to the agent's context for the next hop.", example: "Snippet: \"From Jan 2026 the company extends paid parental leave to 16 weeks.\" (hr.example.com/news)" }
    - { id: sql-back, from: sql, to: agent, style: dashed, description: "Query rows come back as context for the agent's next decision.", example: "rows: [{\"leave_weeks\": 16}]" }
    - { id: answer, from: agent, to: out, description: "Once context is enough the agent stops searching and sends its cited answer out.", example: "{\"action\": \"answer\", \"answer\": \"New hires get 16 weeks of paid parental leave [web: hr.example.com/news].\"}" }
  scenarios:
    - id: two-sources
      label: Internal docs first, then the web
      steps:
        - id: start
          caption: A question arrives at the agent.
          duration: 1000
          events:
            - { type: send, edge: ask, token: { kind: prompt, label: question } }
        - id: internal
          caption: The agent chooses internal documents and sends a rewritten query to the vector database.
          duration: 3000
          events:
            - { type: activate, node: agent, status: thinking, at: [0, 0.25] }
            - { type: send, edge: plan, token: { kind: tool-call, label: query }, at: [0.25, 0.45] }
            - { type: branch, node: router, taken: to-vec, notTaken: [to-web, to-sql], at: [0.45, 0.6] }
            - { type: send, edge: to-vec, token: { kind: tool-call }, at: [0.6, 0.8] }
            - { type: activate, node: vectordb, status: calling, at: [0.6, 0.8] }
            - { type: send, edge: vec-back, token: { kind: result, label: 3 chunks }, at: [0.8, 1] }
        - id: not-enough
          caption: The chunks are out of date, so the agent decides it needs more and tries the web.
          duration: 3200
          events:
            - { type: activate, node: agent, status: thinking, at: [0, 0.25] }
            - { type: send, edge: plan, token: { kind: tool-call, label: new query }, at: [0.25, 0.45] }
            - { type: branch, node: router, taken: to-web, notTaken: [to-vec, to-sql], at: [0.45, 0.6] }
            - { type: send, edge: to-web, token: { kind: tool-call }, at: [0.6, 0.8] }
            - { type: activate, node: web, status: calling, at: [0.6, 0.8] }
            - { type: send, edge: web-back, token: { kind: result, label: snippets }, at: [0.8, 1] }
        - id: answer
          caption: With enough context the agent stops searching and writes a cited answer.
          duration: 2400
          events:
            - { type: activate, node: agent, status: thinking, at: [0, 0.5] }
            - { type: send, edge: answer, token: { kind: result, label: answer }, at: [0.5, 1] }
    - id: no-retrieval
      label: No retrieval needed
      steps:
        - id: start
          caption: A simple question arrives at the agent.
          duration: 1000
          events:
            - { type: send, edge: ask, token: { kind: prompt, label: question } }
        - id: answer
          caption: The agent already knows the answer, skips every source and replies on the first hop.
          duration: 2400
          events:
            - { type: activate, node: agent, status: thinking, at: [0, 0.5] }
            - { type: send, edge: answer, token: { kind: result, label: answer }, at: [0.5, 1] }
variants:
  - id: interleaved
    name: Interleaved (IRCoT)
    summary: "One retriever is searched again after every sentence of reasoning, and each new sentence becomes the next search query."
    origin:
      by: Harsh Trivedi et al.
      org: Stony Brook University, Allen Institute for AI
      year: 2022
      url: https://arxiv.org/abs/2212.10509
      kind: introduced
      note: "IRCoT: Interleaving Retrieval with Chain-of-Thought Reasoning for Knowledge-Intensive Multi-Step Questions (ACL 2023)."
    build:
      goal: "Answer a multi-hop question by alternating one sentence of reasoning with one retrieval, using each new sentence as the next search query."
      steps:
        - "Search the index with the question and put the top 4 paragraphs in a paragraph pool."
        - "Call the model with the {{prompt:reasoner}}, filling in the question, the pool and the reasoning so far; keep only the first sentence of its reply."
        - "If the sentence contains 'So the answer is:', return the text after it, with the reasoning and the ids of the paragraphs used."
        - "Otherwise search the index with that sentence, add any new paragraphs to the pool, append the sentence to the reasoning, and call the model again."
        - "If a search fails, keep the pool as it is and continue; the next sentence becomes the next query."
      stop: "Stop when a sentence contains the answer marker, or after 6 sentences. At the cap, ask the model for the answer directly from the pool and return it, flagged as having hit the step limit."
      requirements:
        - "Make the sentence cap (default 6), the paragraphs per search (default 4) and the pool cap (default 15 paragraphs) parameters."
        - "De-duplicate paragraphs by id before adding them, and drop the oldest when the pool is full."
        - "Cut the model's reply to its first sentence, so a reply that runs ahead cannot skip retrievals."
        - "Log each sentence with the paragraph ids its search returned."
        - "Add a test with a stub LLM that writes 'X was directed by Y.' and then 'So the answer is: Z'; assert two searches, the second with the query 'X was directed by Y.', and the answer 'Z'."
    prompts:
      - id: reasoner
        title: Step-by-step reasoner prompt
        lang: markdown
        source: |
          Answer the question by reasoning one step at a time, using the paragraphs.

          <paragraphs>{{paragraphs}}</paragraphs>
          <question>{{question}}</question>
          <reasoning_so_far>{{reasoning}}</reasoning_so_far>

          Write exactly one next sentence of reasoning.
          When you know the answer, write that sentence as: So the answer is: <answer>
    diagram:
      nodes:
        - { id: user, kind: io, label: Question, description: "A multi-hop question, such as 'In which country was the director of the film Lisbon Story born?'." }
        - { id: retriever, kind: memory, label: Retriever, sublabel: one index, description: "A single document index, searched first with the question and then with each new reasoning sentence." }
        - { id: reasoner, kind: llm, label: Reasoner, description: "Reads the paragraphs found so far and writes exactly one next sentence of reasoning each step." }
        - { id: out, kind: io, label: Answer, description: "The answer, taken from the sentence that starts 'So the answer is'." }
      edges:
        - { id: ask, from: user, to: retriever, label: first query, description: "The question itself is the first search query.", example: "In which country was the director of the film Lisbon Story born?" }
        - { id: paras, from: retriever, to: reasoner, style: dashed, label: paragraphs, description: "The top paragraphs join the pool that the reasoner reads before writing its next sentence.", example: "Lisbon Story is a 1994 film written and directed by Wim Wenders..." }
        - { id: think, from: reasoner, to: retriever, style: loop, label: next query, description: "Each new reasoning sentence is used as the next search query, so retrieval follows the chain of thought.", example: "Lisbon Story was directed by Wim Wenders." }
        - { id: answer, from: reasoner, to: out, label: answer, description: "When a sentence contains 'So the answer is', the loop ends and the answer is returned.", example: "Wim Wenders was born in Düsseldorf, West Germany. So the answer is: Germany." }
      scenarios:
        - id: two-hops
          label: Two hops to the answer
          steps:
            - id: start
              caption: The question is the first query; the index returns paragraphs about the film.
              duration: 2400
              events:
                - { type: send, edge: ask, token: { kind: prompt, label: question }, at: [0, 0.4] }
                - { type: read, node: retriever, at: [0.4, 0.6] }
                - { type: send, edge: paras, token: { kind: result, label: film paras }, at: [0.6, 1] }
            - id: hop
              caption: The reasoner writes that Wim Wenders directed it, and that sentence becomes the next query.
              duration: 3200
              events:
                - { type: activate, node: reasoner, status: thinking, at: [0, 0.3] }
                - { type: branch, node: reasoner, taken: think, notTaken: [answer], at: [0.3, 0.4] }
                - { type: send, edge: think, token: { kind: tool-call, label: Wenders }, at: [0.4, 0.65] }
                - { type: read, node: retriever, at: [0.65, 0.8] }
                - { type: send, edge: paras, token: { kind: result, label: born paras }, at: [0.8, 1] }
            - id: answer
              caption: With the birthplace in the pool, the next sentence states the answer and the loop ends.
              duration: 2400
              events:
                - { type: activate, node: reasoner, status: thinking, at: [0, 0.4] }
                - { type: branch, node: reasoner, taken: answer, notTaken: [think], at: [0.4, 0.55] }
                - { type: send, edge: answer, token: { kind: result, label: Germany }, at: [0.55, 1] }
  - id: adaptive
    name: Adaptive by complexity
    summary: "A classifier rates each question's complexity first, then answers with no retrieval, one retrieval, or an iterative multi-step loop."
    origin:
      by: Soyeong Jeong et al.
      org: KAIST
      year: 2024
      url: https://arxiv.org/abs/2403.14403
      kind: introduced
      note: "Adaptive-RAG: Learning to Adapt Retrieval-Augmented Large Language Models through Question Complexity (NAACL 2024)."
    build:
      goal: "Spend retrieval only where it pays off: classify each question as needing no retrieval, one retrieval or iterative multi-step retrieval, then run the matching strategy."
      steps:
        - "Send the question to a small classifier that returns one label: A (no retrieval), B (single-step) or C (multi-step)."
        - "For A, call the model with the question alone and return its answer."
        - "For B, search the index once with the question, then call the model with the question and the top 5 documents."
        - "For C, loop: search, call the model with the {{prompt:agent}} (with the index as the only source) and every document so far, and either return its answer or search again with the follow-up query it writes."
        - "If the classifier fails or returns an unknown label, treat the question as B. If a search fails, answer from the documents so far (for B, from the question alone) and flag the answer."
      stop: "A and B end after one model call. C ends when the model answers, or after 4 searches; at the cap, answer from the documents gathered and flag the answer as having hit the limit."
      requirements:
        - "Make the search cap for C (default 4) and the documents per search (default 5) parameters."
        - "Train or prompt the classifier on labelled examples of all three classes, and track how often each label is chosen."
        - "Log the label, the strategy run, its search count and its latency for every question."
        - "Add a test with a stub classifier that returns A and a stub retriever; assert the retriever is never called and the model is called exactly once."
    diagram:
      nodes:
        - { id: user, kind: io, label: Question, description: "The user's question, simple or multi-step, such as 'Where was the director of Lisbon Story born?'." }
        - { id: classifier, kind: router, label: Classifier, sublabel: small model, description: "A small model trained to label each question A (no retrieval), B (one search) or C (multi-step)." }
        - { id: retriever, kind: memory, label: Retriever, description: "The document index: searched once for B questions and repeatedly for C questions." }
        - { id: llm, kind: llm, label: LLM, description: "Writes the answer; for C questions it may instead write a follow-up query and loop." }
        - { id: out, kind: io, label: Answer, description: "The final answer, from whichever strategy the classifier picked." }
      edges:
        - { id: ask, from: user, to: classifier, description: "Every question is classified before any retrieval happens.", example: "Simple: What is the capital of Portugal? Multi-step: Where was the director of the film Lisbon Story born?" }
        - { id: simple, from: classifier, to: llm, label: "A: none", description: "Simple questions go straight to the model with no retrieval at all.", example: "Q: What is the capital of Portugal? -> label A, no retrieval" }
        - { id: retrieve, from: classifier, to: retriever, label: "B/C: search", description: "Questions that need facts are searched once (B) or iteratively (C).", example: "Q: Where was the director of Lisbon Story born? -> label C, multi-step" }
        - { id: docs, from: retriever, to: llm, style: dashed, label: docs, description: "Retrieved documents are added to the model's context.", example: "Lisbon Story is a 1994 film written and directed by Wim Wenders..." }
        - { id: more, from: llm, to: retriever, style: loop, label: next query, description: "For C questions only, the model writes a follow-up query and the search repeats until it can answer.", example: "Follow-up query: Wim Wenders birthplace" }
        - { id: answer, from: llm, to: out, description: "The model's answer, once its strategy has gathered what it needs.", example: "Wim Wenders was born in Düsseldorf, so the answer is Germany." }
      scenarios:
        - id: multi-step
          label: A multi-step question
          steps:
            - id: classify
              caption: The classifier labels the question C, multi-step, and sends it to the retriever.
              duration: 2400
              events:
                - { type: send, edge: ask, token: { kind: prompt, label: question }, at: [0, 0.3] }
                - { type: activate, node: classifier, status: thinking, at: [0.3, 0.55] }
                - { type: branch, node: classifier, taken: retrieve, notTaken: [simple], at: [0.55, 0.7] }
                - { type: send, edge: retrieve, token: { kind: tool-call, label: label C }, at: [0.7, 1] }
            - id: hop-1
              caption: The first documents name the director, so the model writes a follow-up query.
              duration: 3000
              events:
                - { type: read, node: retriever, at: [0, 0.2] }
                - { type: send, edge: docs, token: { kind: result, label: Wenders }, at: [0.2, 0.5] }
                - { type: activate, node: llm, status: thinking, at: [0.5, 0.7] }
                - { type: send, edge: more, token: { kind: tool-call, label: birthplace }, at: [0.7, 1] }
            - id: hop-2
              caption: The second search finds the birthplace and the model answers.
              duration: 3000
              events:
                - { type: read, node: retriever, at: [0, 0.2] }
                - { type: send, edge: docs, token: { kind: result, label: Düsseldorf }, at: [0.2, 0.5] }
                - { type: branch, node: llm, taken: answer, notTaken: [more], at: [0.5, 0.65] }
                - { type: send, edge: answer, token: { kind: result, label: Germany }, at: [0.65, 1] }
        - id: simple
          label: A simple question
          steps:
            - id: classify
              caption: The classifier labels the question A, so retrieval is skipped entirely.
              duration: 2400
              events:
                - { type: send, edge: ask, token: { kind: prompt, label: question }, at: [0, 0.3] }
                - { type: activate, node: classifier, status: thinking, at: [0.3, 0.55] }
                - { type: branch, node: classifier, taken: simple, notTaken: [retrieve], at: [0.55, 0.7] }
                - { type: send, edge: simple, token: { kind: prompt, label: label A }, at: [0.7, 1] }
            - id: answer
              caption: The model answers from what it already knows, in a single call.
              duration: 2000
              events:
                - { type: activate, node: llm, status: thinking, at: [0, 0.5] }
                - { type: send, edge: answer, token: { kind: result, label: Lisbon }, at: [0.5, 1] }
