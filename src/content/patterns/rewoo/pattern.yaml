slug: rewoo
name: ReWOO
family: planning-search
aliases: [Reasoning WithOut Observation, Planner-worker-solver]
summary: "Plan every tool call upfront using placeholders (#E1, #E2), run them, then a solver writes the answer in one pass."
badges: { autonomy: medium, cost: medium, latency: medium }
sources:
  - title: "ReWOO: Decoupling Reasoning from Observations for Efficient Augmented Language Models (Xu et al., 2023)"
    url: https://arxiv.org/abs/2305.18323
  - title: Plan-and-Execute Agents (LangChain, 2024)
    url: https://www.langchain.com/blog/planning-agents
related:
  composesWith: [llm-compiler]
  confusedWith:
    - { slug: react, difference: "ReAct calls the model again after every observation to choose the next action; ReWOO writes the whole plan once, runs it with no model calls in between, and never revisits the planner." }
    - { slug: plan-and-execute, difference: "Plan-and-Execute has a replanner that revises the plan after each step; ReWOO's plan is final and the tools run blind." }
    - { slug: llm-compiler, difference: "LLMCompiler plans a dependency graph, runs independent calls in parallel and lets a joiner trigger a replan. ReWOO runs its planned calls in order, and its plan is final." }
origin:
  by: Binfeng Xu et al.
  year: 2023
  url: https://arxiv.org/abs/2305.18323
  kind: introduced
  note: "The authors' affiliations are not confirmed: the paper's first page lists only email addresses (microsoft.com, tamu.edu, ncsu.edu), so no organisation is given here."
build:
  goal: "Answer a question with two model calls on the happy path: a planner that writes every tool call upfront with #E placeholders, and a solver that answers from the collected evidence."
  steps:
    - "Call the planner model once with the {{prompt:planner}}, passing the question and the tool descriptions."
    - "Parse the reply into an ordered list of steps, each with a reason, a variable (#E1, #E2...), a tool name and an input string."
    - "Validate the plan before running anything: every tool name exists, every variable is unique, and every #E an input mentions belongs to an earlier step."
    - "Run the steps in order with plain code and no model calls: substitute the stored evidence for each #E in the input, call the tool, and store the result under its variable."
    - "Call the solver model once with the {{prompt:solver}}, passing the question and the plan with every step's evidence filled in, and return its answer."
  stop: "Stop after the solver's single call; the planner is never called again (an LLM used as a worker tool counts as a tool, not a planner call). If the plan fails validation twice, stop before any tool runs and return the validation errors with a failed status."
  requirements:
    - "Cap the plan length (default 8 steps) and give each tool call a timeout (default 30 seconds)."
    - "If the plan cannot be parsed or fails validation, retry the planner once with the errors appended; do not run a partly valid plan."
    - "When a tool call errors or times out, store the error text as that variable's evidence and keep going, so the solver can say what it could not determine."
    - "Log the plan, each substituted tool input and each piece of evidence, so a wrong answer can be traced to the step that caused it."
    - "Add a test with a stub LLM that plans 3 steps and fake tools; assert exactly two model calls (one planner, one solver), and that the third tool received the first two results in place of #E1 and #E2."
defaultVariantName: Sequential workers
prompts:
  - id: planner
    title: Planner prompt
    lang: markdown
    source: |
      For the question below, make a plan of tool calls that will gather
      everything needed. Write the whole plan now. You will not see any
      tool output before the plan is executed.

      Tools:
      {{tool_descriptions}}

      Format, one pair per step:
      Plan: a short reason for this step
      #E1 = Tool[input]

      A later step may use the output of an earlier one by writing its
      variable (#E1, #E2, ...) inside its input.

      Question: {{question}}
  - id: solver
    title: Solver prompt
    lang: markdown
    source: |
      Solve the question using only the plan and the evidence below. If the
      evidence is missing or contradictory, say so instead of guessing.

      Question: {{question}}

      Plan and evidence:
      {{plan_with_evidence}}

      Give the final answer with one sentence of justification.
diagram:
  nodes:
    - id: user
      kind: io
      label: Question
      description: "The question to answer, such as 'What is Iceland's population density?'."
    - id: planner
      kind: llm
      label: Planner
      description: "Called once: writes every tool call upfront, using #E placeholders for results it cannot see yet."
    - id: search
      kind: tool
      label: Search
      description: "Runs the plan's lookups, such as Iceland's population as #E1 and its area as #E2."
    - id: calculator
      kind: tool
      label: Calculator
      description: "Runs the arithmetic step, dividing #E1 by #E2 once those values have been substituted in."
    - id: evidence
      kind: memory
      label: Evidence
      description: "Stores each tool result under its variable (#E1, #E2, #E3) for the solver to read."
    - id: solver
      kind: llm
      label: Solver
      description: "Called once: reads the question, plan and all evidence together and writes the final answer."
    - id: out
      kind: io
      label: Answer
      description: "The solver's final answer with a one-sentence justification."
  edges:
    - id: ask
      from: user
      to: planner
      description: "The question goes to the planner, which is only ever called this one time."
      example: "Question: What is Iceland's population density?"
    - id: plan
      from: planner
      to: search
      label: "#E1 #E2 #E3"
      description: "The full plan, a list of tool calls with placeholders, which the workers run with no model calls between."
      example: "Plan: Get population. #E1 = Search[Iceland population] Plan: Get area. #E2 = Search[Iceland area km2] Plan: Divide. #E3 = Calculator[#E1 / #E2]"
    - id: hand-off
      from: search
      to: calculator
      label: "#E1, #E2"
      description: "Earlier results are substituted for #E1 and #E2 in the calculator's input, with no model call."
      example: "Calculator[#E1 / #E2] becomes Calculator[376000 / 103000]"
    - id: log-search
      from: search
      to: evidence
      style: dashed
      description: "Each search result is saved under its placeholder variable."
      example: "#E1 = 376,000 people; #E2 = 103,000 km2"
    - id: log-calc
      from: calculator
      to: evidence
      style: dashed
      description: "The calculator's result is saved as the last piece of evidence."
      example: "#E3 = 3.65"
    - id: gather
      from: evidence
      to: solver
      description: "The plan and every piece of evidence are given to the solver in one prompt."
      example: "Plan and evidence: #E1 = 376,000; #E2 = 103,000 km2; #E3 = 3.65"
    - id: answer
      from: solver
      to: out
      description: "The solver's single pass produces the answer; the planner is never revisited."
      example: "About 3.7 people per km2, from 376,000 people over 103,000 km2."
  scenarios:
    - id: population-density
      label: '"What is Iceland''s population density?"'
      steps:
        - id: ask
          caption: The question reaches the planner, which will be called exactly once.
          duration: 1000
          events:
            - { type: send, edge: ask, token: { kind: prompt, label: "density?" } }
        - id: plan
          caption: The planner writes every tool call at once, using placeholders for results it has not seen yet.
          duration: 2800
          events:
            - { type: activate, node: planner, status: thinking, at: [0, 0.5] }
            - { type: send, edge: plan, token: { kind: tokens, label: "#E1 #E2 #E3" }, at: [0.5, 1] }
        - id: search
          caption: "Search runs the first two calls, population as #E1 and area as #E2, and logs each to the evidence store."
          duration: 3000
          events:
            - { type: activate, node: search, status: calling, at: [0, 0.5] }
            - { type: send, edge: log-search, token: { kind: result, label: "#E1 #E2" }, at: [0.5, 0.8] }
            - { type: write, node: evidence, at: [0.8, 1] }
        - id: calculate
          caption: "The calculator runs the third call with #E1 and #E2 substituted in, with no model call in between."
          duration: 3000
          events:
            - { type: send, edge: hand-off, token: { kind: result, label: "#E1, #E2" }, at: [0, 0.3] }
            - { type: activate, node: calculator, status: calling, at: [0.3, 0.6] }
            - { type: send, edge: log-calc, token: { kind: result, label: "#E3" }, at: [0.6, 0.85] }
            - { type: write, node: evidence, at: [0.85, 1] }
        - id: solve
          caption: The solver reads the plan and all the evidence once and writes the answer, and the planner is never revisited.
          duration: 2800
          events:
            - { type: read, node: evidence, at: [0, 0.2] }
            - { type: send, edge: gather, token: { kind: tokens, label: evidence }, at: [0.2, 0.5] }
            - { type: activate, node: solver, status: thinking, at: [0.5, 0.75] }
            - { type: send, edge: answer, token: { kind: result, label: 3.7 per km2 }, at: [0.75, 1] }
variants:
  - id: parallel-workers
    name: Parallel evidence
    summary: "Planned calls that do not reference each other's #E results run at the same time; only a call that needs an earlier result waits for it."
    build:
      goal: "Answer a question with one planner call and one solver call, running the planned tool calls in dependency waves so that independent calls overlap."
      steps:
        - "Call the planner model once with the {{prompt:planner}}, passing the question and the tool descriptions, and parse the steps (variable, tool, input) as in the sequential version."
        - "For each step, record the set of #E variables its input mentions; reject the plan if any refers to a later or missing step."
        - "Start every step whose referenced variables all have evidence, concurrently, with each input's #E placeholders substituted."
        - "As each call finishes, store its result under its variable and start any step that has just become ready; repeat until no step is waiting."
        - "Call the solver model once with the {{prompt:solver}}, passing the question and the plan with all evidence filled in, and return its answer."
      stop: "Stop after the solver's single call. If a step can never start because its input depends on a failed step, mark it skipped rather than waiting forever."
      requirements:
        - "Cap the concurrent tool calls (default 4) and the plan length (default 8), and give each call a timeout (default 30 seconds)."
        - "If a tool call errors, store the error text as its evidence and mark every step that depends on it as skipped, with the reason, in the evidence."
        - "If the plan cannot be parsed or has a dependency cycle, retry the planner once with the error appended, then stop before any tool runs."
        - "Record each call's start and end time, so the overlap is visible in logs."
        - "Add a test with a stub planner and two fake 100 ms search tools; assert both searches started before either finished and the calculator started only after both."
    diagram:
      nodes:
        - id: user
          kind: io
          label: Question
          description: "The question to answer, such as 'What is Iceland's population density?'."
        - id: planner
          kind: llm
          label: Planner
          description: "Called once: writes every tool call upfront with #E placeholders, exactly as in the sequential version."
        - id: s1
          kind: tool
          label: Search
          sublabel: "#E1"
          description: "The population lookup. It references no other result, so it starts as soon as the plan is parsed."
        - id: s2
          kind: tool
          label: Search
          sublabel: "#E2"
          description: "The area lookup. It is independent of #E1, so it runs at the same time."
        - id: calculator
          kind: tool
          label: Calculator
          sublabel: "#E3"
          description: "The division step. Its input mentions #E1 and #E2, so it waits for both, then runs."
        - id: solver
          kind: llm
          label: Solver
          sublabel: "all #E"
          description: "Called once: reads the question, plan and all evidence together and writes the final answer."
        - id: out
          kind: io
          label: Answer
          description: "The solver's final answer with a one-sentence justification."
      edges:
        - id: ask
          from: user
          to: planner
          description: "The question goes to the planner, which is only ever called this one time."
          example: "Question: What is Iceland's population density?"
        - id: run1
          from: planner
          to: s1
          label: "#E1"
          description: "The first planned call has no #E in its input, so it is started immediately."
          example: "#E1 = Search[Iceland population]"
        - id: run2
          from: planner
          to: s2
          label: "#E2"
          description: "The second planned call is also free of #E references, so it starts in the same wave as #E1."
          example: "#E2 = Search[Iceland area km2]"
        - id: dep1
          from: s1
          to: calculator
          style: dashed
          description: "The population result is substituted for #E1 in the calculator's input."
          example: "#E1 = 376,000"
        - id: dep2
          from: s2
          to: calculator
          style: dashed
          description: "The area result is substituted for #E2; with both in place, the calculator is released."
          example: "#E2 = 103,000 km2"
        - id: evidence
          from: calculator
          to: solver
          label: evidence
          description: "With the last step done, the plan and all three results (#E1 to #E3) go to the solver together in one prompt."
          example: "#E1 = 376,000; #E2 = 103,000 km2; #E3 = 3.65"
        - id: answer
          from: solver
          to: out
          description: "The solver's single pass produces the answer; the planner is never revisited."
          example: "About 3.7 people per km2, from 376,000 people over 103,000 km2."
      scenarios:
        - id: population-density
          label: '"What is Iceland''s population density?"'
          steps:
            - id: ask
              caption: The question reaches the planner, which will be called exactly once.
              duration: 1000
              events:
                - { type: send, edge: ask, token: { kind: prompt, label: "density?" } }
            - id: wave-1
              caption: "The plan is parsed; #E1 and #E2 reference nothing, so both searches start at once while the calculator waits."
              duration: 3000
              events:
                - { type: activate, node: planner, status: thinking, at: [0, 0.35] }
                - { type: send, edge: run1, token: { kind: tool-call, label: "#E1" }, at: [0.35, 0.65] }
                - { type: send, edge: run2, token: { kind: tool-call, label: "#E2" }, at: [0.35, 0.65] }
                - { type: activate, node: calculator, status: waiting, at: [0.35, 1] }
                - { type: activate, node: s1, status: calling, at: [0.65, 1] }
                - { type: activate, node: s2, status: calling, at: [0.65, 1] }
            - id: wave-2
              caption: "Both results arrive and are substituted into the calculator's input, which releases it."
              duration: 2600
              events:
                - { type: send, edge: dep1, token: { kind: result, label: "#E1" }, at: [0, 0.4] }
                - { type: send, edge: dep2, token: { kind: result, label: "#E2" }, at: [0.1, 0.5] }
                - { type: activate, node: calculator, status: calling, at: [0.5, 1] }
            - id: solve
              caption: The solver reads the plan and all the evidence once and writes the answer.
              duration: 2600
              events:
                - { type: send, edge: evidence, token: { kind: tokens, label: evidence }, at: [0, 0.4] }
                - { type: activate, node: solver, status: thinking, at: [0.4, 0.7] }
                - { type: send, edge: answer, token: { kind: result, label: 3.7 per km2 }, at: [0.7, 1] }
