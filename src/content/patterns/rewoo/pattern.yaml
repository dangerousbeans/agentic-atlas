slug: rewoo
name: ReWOO
family: planning-search
aliases: [Reasoning WithOut Observation, Planner-worker-solver]
summary: Plan every tool call upfront using placeholders (#E1, #E2), run them, then a solver writes the answer in one pass.
badges: { autonomy: medium, cost: medium, latency: medium }
sources:
  - title: "ReWOO: Decoupling Reasoning from Observations for Efficient Augmented Language Models (Xu et al., 2023)"
    url: https://arxiv.org/abs/2305.18323
  - title: Plan-and-Execute Agents (LangChain, 2024)
    url: https://www.langchain.com/blog/planning-agents
related:
  composesWith: [llm-compiler]
  confusedWith:
    - { slug: react, difference: "ReAct calls the model again after every observation to choose the next action; ReWOO writes the whole plan once, runs it with no model calls in between, and never revisits the planner." }
    - { slug: plan-and-execute, difference: "Plan-and-Execute has a replanner that revises the plan after each step; ReWOO's plan is final and the tools run blind." }
code:
  - id: rewoo
    title: rewoo.py
    lang: python
    source: |
      def rewoo(question, tools):
          plan = llm(PLANNER_PROMPT, question=question)    # every call, with #E placeholders
          evidence = {}
          for step in plan.steps:                          # no LLM call in this loop
              args = substitute(step.args, evidence)       # fill in #E1, #E2 ...
              evidence[step.var] = tools[step.tool](args)
          return llm(SOLVER_PROMPT, question=question, plan=plan, evidence=evidence)
prompts:
  - id: planner
    title: Planner prompt
    lang: markdown
    source: |
      For the question below, make a plan of tool calls that will gather
      everything needed. Write the whole plan now. You will not see any
      tool output before the plan is executed.

      Tools:
      {{tool_descriptions}}

      Format, one pair per step:
      Plan: a short reason for this step
      #E1 = Tool[input]

      A later step may use the output of an earlier one by writing its
      variable (#E1, #E2, ...) inside its input.

      Question: {{question}}
  - id: solver
    title: Solver prompt
    lang: markdown
    source: |
      Solve the question using only the plan and the evidence below. If the
      evidence is missing or contradictory, say so instead of guessing.

      Question: {{question}}

      Plan and evidence:
      {{plan_with_evidence}}

      Give the final answer with one sentence of justification.
diagram:
  nodes:
    - id: user
      kind: io
      label: Question
      description: "The question to answer, such as 'What is Iceland's population density?'."
    - id: planner
      kind: llm
      label: Planner
      description: "Called once: writes every tool call upfront, using #E placeholders for results it cannot see yet."
    - id: search
      kind: tool
      label: Search
      description: "Runs the plan's lookups, such as Iceland's population as #E1 and its area as #E2."
    - id: calculator
      kind: tool
      label: Calculator
      description: "Runs the arithmetic step, dividing #E1 by #E2 once those values have been substituted in."
    - id: evidence
      kind: memory
      label: Evidence
      description: "Stores each tool result under its variable (#E1, #E2, #E3) for the solver to read."
    - id: solver
      kind: llm
      label: Solver
      description: "Called once: reads the question, plan and all evidence together and writes the final answer."
    - id: out
      kind: io
      label: Answer
      description: "The solver's final answer with a one-sentence justification."
  edges:
    - id: ask
      from: user
      to: planner
      description: "The question goes to the planner, which is only ever called this one time."
      example: "Question: What is Iceland's population density?"
    - id: plan
      from: planner
      to: search
      label: "#E1 #E2 #E3"
      description: "The full plan, a list of tool calls with placeholders, which the workers run with no model calls between."
      example: "Plan: Get population. #E1 = Search[Iceland population] Plan: Get area. #E2 = Search[Iceland area km2] Plan: Divide. #E3 = Calculator[#E1 / #E2]"
    - id: hand-off
      from: search
      to: calculator
      label: "#E1, #E2"
      description: "Earlier results are substituted for #E1 and #E2 in the calculator's input, with no model call."
      example: "Calculator[#E1 / #E2] becomes Calculator[376000 / 103000]"
    - id: log-search
      from: search
      to: evidence
      style: dashed
      description: "Each search result is saved under its placeholder variable."
      example: "#E1 = 376,000 people; #E2 = 103,000 km2"
    - id: log-calc
      from: calculator
      to: evidence
      style: dashed
      description: "The calculator's result is saved as the last piece of evidence."
      example: "#E3 = 3.65"
    - id: gather
      from: evidence
      to: solver
      description: "The plan and every piece of evidence are given to the solver in one prompt."
      example: "Plan and evidence: #E1 = 376,000; #E2 = 103,000 km2; #E3 = 3.65"
    - id: answer
      from: solver
      to: out
      description: "The solver's single pass produces the answer; the planner is never revisited."
      example: "About 3.7 people per km2, from 376,000 people over 103,000 km2."
  scenarios:
    - id: population-density
      label: '"What is Iceland''s population density?"'
      steps:
        - id: ask
          caption: The question reaches the planner, which will be called exactly once.
          duration: 1000
          codeRef: { block: rewoo, lines: "1" }
          events:
            - { type: send, edge: ask, token: { kind: prompt, label: "density?" } }
        - id: plan
          caption: The planner writes every tool call at once, using placeholders for results it has not seen yet.
          duration: 2800
          codeRef: { block: rewoo, lines: "2" }
          events:
            - { type: activate, node: planner, status: thinking, at: [0, 0.5] }
            - { type: send, edge: plan, token: { kind: tokens, label: "#E1 #E2 #E3" }, at: [0.5, 1] }
        - id: search
          caption: Search runs the first two calls, population as #E1 and area as #E2, and logs each to the evidence store.
          duration: 3000
          codeRef: { block: rewoo, lines: "4-6" }
          events:
            - { type: activate, node: search, status: calling, at: [0, 0.5] }
            - { type: send, edge: log-search, token: { kind: result, label: "#E1 #E2" }, at: [0.5, 0.8] }
            - { type: write, node: evidence, at: [0.8, 1] }
        - id: calculate
          caption: The calculator runs the third call with #E1 and #E2 substituted in, with no model call in between.
          duration: 3000
          codeRef: { block: rewoo, lines: "5-6" }
          events:
            - { type: send, edge: hand-off, token: { kind: result, label: "#E1, #E2" }, at: [0, 0.3] }
            - { type: activate, node: calculator, status: calling, at: [0.3, 0.6] }
            - { type: send, edge: log-calc, token: { kind: result, label: "#E3" }, at: [0.6, 0.85] }
            - { type: write, node: evidence, at: [0.85, 1] }
        - id: solve
          caption: The solver reads the plan and all the evidence once and writes the answer, and the planner is never revisited.
          duration: 2800
          codeRef: { block: rewoo, lines: "7" }
          events:
            - { type: read, node: evidence, at: [0, 0.2] }
            - { type: send, edge: gather, token: { kind: tokens, label: evidence }, at: [0.2, 0.5] }
            - { type: activate, node: solver, status: thinking, at: [0.5, 0.75] }
            - { type: send, edge: answer, token: { kind: result, label: 3.7 per km2 }, at: [0.75, 1] }
