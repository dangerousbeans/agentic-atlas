slug: handoffs
name: Handoffs
family: multi-agent
aliases: [Decentralized pattern, Swarm, Peer-to-peer]
summary: Agents pass the whole conversation to each other; the agent holding it talks directly to the user, and there's no central manager.
badges: { autonomy: high, cost: medium, latency: medium }
sources:
  - title: A practical guide to building agents (OpenAI, 2025)
    url: https://cdn.openai.com/business-guides-and-resources/a-practical-guide-to-building-agents.pdf
  - title: "openai/swarm: Educational framework exploring ergonomic, lightweight multi-agent orchestration"
    url: https://github.com/openai/swarm
related:
  composesWith: [guardrails, human-in-the-loop]
  confusedWith:
    - { slug: routing, difference: "Routing classifies once and dispatches to a handler that answers; with handoffs control keeps moving, and the receiving agent can hand off again mid-conversation." }
    - { slug: supervisor, difference: "A supervisor stays in charge and gets every result back; with handoffs the baton is passed on and the previous agent steps out." }
prompts:
  - id: triage
    title: Triage agent instructions
    lang: markdown
    source: |
      You are the front desk for {{company}}. Greet the user and work out what
      they need. Do not try to solve the problem yourself.

      Hand off with exactly one tool:
      - transfer_to_billing: charges, invoices, plans
      - transfer_to_tech: errors, bugs, how-to questions
      Before you hand off, state the user's goal in one sentence so the next
      agent does not have to ask again.
  - id: specialist
    title: Specialist agent instructions
    lang: markdown
    source: |
      You are the {{role}} agent for {{company}}. You now own this conversation.
      The full history above is yours to read.

      Help the user directly. If the request belongs to another agent, hand off
      with {{handoff_tools}} and say what you are passing on.
      Never ask the user to repeat something already in the history.
diagram:
  nodes:
    - { id: user, kind: io, label: User, description: "The customer, who talks to whichever agent currently holds the conversation, e.g. 'I was charged twice'." }
    - { id: triage, kind: agent, label: Triage, description: "Front-desk agent. Works out what the user needs and hands off to billing or tech, without solving it itself." }
    - { id: billing, kind: agent, label: Billing, description: "Specialist for charges, invoices and plans. Owns the conversation after handoff and may pass it to refunds." }
    - { id: tech, kind: agent, label: Tech support, description: "Specialist for errors, bugs and how-to questions, e.g. an app that crashes on login." }
    - { id: refunds, kind: agent, label: Refunds, description: "Specialist that issues refunds and replies to the user itself." }
  edges:
    - { id: in, from: user, to: triage, description: "The user's first message lands with the triage agent.", example: "I was charged twice for my March invoice." }
    - { id: to-billing, from: triage, to: billing, label: handoff, description: "Triage passes the whole conversation and a one-sentence goal to billing, then steps out.", example: "transfer_to_billing: \"User says they were charged twice on the March invoice and wants it fixed.\"" }
    - { id: to-tech, from: triage, to: tech, label: handoff, description: "Triage passes the whole conversation to tech support, then steps out.", example: "transfer_to_tech: \"User reports the app crashes whenever they log in.\"" }
    - { id: billing-reply, from: billing, to: user, description: "Billing answers the user directly, with no manager in between.", example: "I can see two charges of $29 on March 3. Want me to look into a refund?" }
    - { id: tech-reply, from: tech, to: user, description: "Tech support answers the user directly.", example: "Let's try clearing the app cache. Go to Settings > Storage > Clear cache, then log in again." }
    - { id: to-refunds, from: billing, to: refunds, label: handoff, description: "Billing passes the baton, with the full history, when the user asks for money back.", example: "transfer_to_refunds: \"Duplicate $29 charge on March 3 confirmed; user wants a refund.\"" }
    - { id: refunds-reply, from: refunds, to: user, description: "Refunds replies to the user itself, ending the run with this agent holding the conversation.", example: "Done: I've refunded $29 to your card. It should arrive in 3-5 days." }
  scenarios:
    - id: billing-refund
      label: '"I was charged twice"'
      steps:
        - id: arrive
          caption: The user's message lands with the triage agent, which holds the conversation first.
          duration: 1400
          events:
            - { type: send, edge: in, token: { kind: prompt, label: charged twice } }
            - { type: activate, node: triage, status: thinking, at: [0.5, 1] }
        - id: first-handoff
          caption: Triage hands the whole conversation to billing; the tech route dims and triage steps out.
          duration: 2400
          events:
            - { type: branch, node: triage, taken: to-billing, notTaken: [to-tech], at: [0, 0.4] }
            - { type: send, edge: to-billing, token: { kind: prompt, label: baton }, at: [0.4, 1] }
        - id: billing-talks
          caption: Billing now owns the conversation and answers the user directly, with no manager in between.
          duration: 2400
          events:
            - { type: activate, node: billing, status: thinking, at: [0, 0.5] }
            - { type: send, edge: billing-reply, token: { kind: result, label: reply }, at: [0.5, 1] }
        - id: second-handoff
          caption: The user's next message asks for the money back, so billing passes the baton on to refunds.
          duration: 2400
          events:
            - { type: activate, node: billing, status: thinking, at: [0, 0.3] }
            - { type: send, edge: to-refunds, token: { kind: prompt, label: baton }, at: [0.3, 1] }
        - id: refunds-talks
          caption: Refunds issues the refund and replies to the user itself.
          duration: 2400
          events:
            - { type: activate, node: refunds, status: thinking, at: [0, 0.5] }
            - { type: send, edge: refunds-reply, token: { kind: result, label: refunded }, at: [0.5, 1] }
        - id: done
          caption: The refunds agent answers without handing off, so the run ends with it holding the conversation.
          duration: 1600
          events:
            - { type: activate, node: refunds, status: done }
    - id: tech
      label: '"The app crashes on login"'
      steps:
        - id: arrive
          caption: The user's message lands with the triage agent.
          duration: 1400
          events:
            - { type: send, edge: in, token: { kind: prompt, label: crash } }
            - { type: activate, node: triage, status: thinking, at: [0.5, 1] }
        - id: handoff
          caption: Triage hands the conversation to tech support; the billing route dims.
          duration: 2400
          events:
            - { type: branch, node: triage, taken: to-tech, notTaken: [to-billing], at: [0, 0.4] }
            - { type: send, edge: to-tech, token: { kind: prompt, label: baton }, at: [0.4, 1] }
        - id: tech-talks
          caption: Tech support walks the user through a fix directly.
          duration: 2400
          events:
            - { type: activate, node: tech, status: thinking, at: [0, 0.5] }
            - { type: send, edge: tech-reply, token: { kind: result, label: reply }, at: [0.5, 1] }
