slug: voting
name: "Parallelization: Voting"
family: workflows
aliases: [Self-consistency, Ensembling, Majority vote]
summary: Run the same task N times, or with N different prompts, and take the majority or consensus answer.
badges: { autonomy: low, cost: high, latency: low }
sources:
  - title: Building effective agents (Anthropic, 2024)
    url: https://www.anthropic.com/engineering/building-effective-agents
  - title: Self-Consistency Improves Chain of Thought Reasoning in Language Models (Wang et al., 2022)
    url: https://arxiv.org/abs/2203.11171
related:
  composesWith: [routing, prompt-chaining]
  confusedWith:
    - { slug: sectioning, difference: "Voting runs the same task several times and compares answers; sectioning gives each call a different part of the work." }
    - { slug: evaluator-optimizer, difference: "Voting picks among independent attempts; the evaluator-optimizer revises one attempt using feedback, in a loop." }
prompts:
  - id: audit
    title: Vulnerability audit prompt
    lang: markdown
    source: |
      Decide whether the code below contains an exploitable
      vulnerability. Reason step by step, then end with a final line
      of exactly "VERDICT: vulnerable" or "VERDICT: safe".

      <code>{{snippet}}</code>
  - id: variant
    title: Alternate-perspective prompt
    lang: markdown
    source: |
      You are a {{persona}} reviewing the code below for exploitable
      vulnerabilities. Judge only what the code shows, not what it
      might be used for. End with "VERDICT: vulnerable" or "VERDICT: safe".

      <code>{{snippet}}</code>
diagram:
  nodes:
    - { id: user, kind: io, label: Code, description: "The code snippet to audit for an exploitable vulnerability." }
    - { id: llm1, kind: llm, label: Voter 1, description: "First independent voter: audits the snippet, reasons step by step and ends with VERDICT: vulnerable or safe." }
    - { id: llm2, kind: llm, label: Voter 2, description: "Second independent voter: gets the same snippet and reasons on its own, so its answer can differ." }
    - { id: llm3, kind: llm, label: Voter 3, description: "Third independent voter: also audits the same snippet separately and may disagree with the others." }
    - { id: aggregator, kind: aggregator, label: Tally, model: false, description: "Plain code, not a model: counts verdicts and returns the majority, or 'needs human review' without one." }
    - { id: out, kind: io, label: Verdict, description: "The winning verdict, or 'needs human review' when no answer gets a majority." }
  edges:
    - { id: v1, from: user, to: llm1, description: "The same snippet goes to voter 1 in the audit prompt, sampled at temperature 0.8.", example: "Decide whether the code below contains an exploitable vulnerability. <code>query = 'SELECT * FROM users WHERE id=' + uid</code>" }
    - { id: v2, from: user, to: llm2, description: "An identical copy goes to voter 2, also at temperature 0.8; voters share nothing.", example: "Decide whether the code below contains an exploitable vulnerability. <code>query = 'SELECT * FROM users WHERE id=' + uid</code>" }
    - { id: v3, from: user, to: llm3, description: "An identical copy goes to voter 3 at temperature 0.8; only sampling makes its answer differ.", example: "Decide whether the code below contains an exploitable vulnerability. <code>query = 'SELECT * FROM users WHERE id=' + uid</code>" }
    - { id: a1, from: llm1, to: aggregator, description: "Voter 1's reasoning and final verdict line go to the tally.", example: "The uid value is concatenated into the SQL string with no escaping, so it is injectable. VERDICT: vulnerable" }
    - { id: a2, from: llm2, to: aggregator, description: "Voter 2's reasoning and final verdict line go to the tally.", example: "String concatenation into a query lets an attacker alter it. VERDICT: vulnerable" }
    - { id: a3, from: llm3, to: aggregator, description: "Voter 3's reasoning and final verdict line go to the tally; this one dissents.", example: "No exploit shown without knowing how uid is built. VERDICT: safe" }
    - { id: done, from: aggregator, to: out, description: "The majority verdict leaves the tally as the final answer.", example: "vulnerable" }
  scenarios:
    - id: majority
      label: '"Is this snippet vulnerable?"'
      steps:
        - id: fan-out
          caption: The same snippet goes to three voters, each sampled independently.
          duration: 1400
          events:
            - { type: send, edge: v1, token: { kind: prompt, label: snippet } }
            - { type: send, edge: v2, token: { kind: prompt, label: snippet } }
            - { type: send, edge: v3, token: { kind: prompt, label: snippet } }
        - id: work
          caption: Each voter reasons on its own and arrives at an answer.
          duration: 2600
          events:
            - { type: activate, node: llm1, status: thinking, at: [0, 0.5] }
            - { type: activate, node: llm2, status: thinking, at: [0, 0.75] }
            - { type: activate, node: llm3, status: thinking, at: [0, 0.9] }
            - { type: send, edge: a1, token: { kind: result, label: A }, at: [0.5, 0.7] }
            - { type: send, edge: a2, token: { kind: result, label: A }, at: [0.75, 0.9] }
            - { type: send, edge: a3, token: { kind: result, label: B }, at: [0.9, 1] }
        - id: tally
          caption: The tally counts two votes for A and one for B, so A wins.
          duration: 1600
          events:
            - { type: activate, node: aggregator, status: thinking }
        - id: verdict
          caption: The majority answer A is returned as the verdict.
          duration: 1400
          events:
            - { type: send, edge: done, token: { kind: result, label: A } }
