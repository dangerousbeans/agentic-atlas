slug: prompt-chaining
name: Prompt Chaining
family: workflows
aliases: [Pipeline, Sequential workflow]
summary: Break a task into fixed steps, where each LLM call works on the previous output, with optional code checks between steps.
badges: { autonomy: low, cost: low, latency: medium }
sources:
  - title: Building effective agents (Anthropic, 2024)
    url: https://www.anthropic.com/engineering/building-effective-agents
related:
  composesWith: [routing, evaluator-optimizer]
  confusedWith:
    - { slug: orchestrator-workers, difference: "A chain runs the same fixed steps in order every time; an orchestrator decides the steps at run time." }
prompts:
  - id: outline
    title: Step 1, outline prompt
    lang: markdown
    source: |
      You are planning a blog post for {{audience}}.

      <brief>{{brief}}</brief>

      Write an outline with 4 to 6 sections. Give each section a heading
      and one sentence on what it must prove. Output JSON:
      {"sections": [{"heading": "...", "point": "..."}]}
  - id: draft
    title: Step 2, draft prompt
    lang: markdown
    source: |
      Write the full post from this approved outline. Follow it exactly:
      same sections, same order, no new sections.

      <outline>{{outline}}</outline>

      Keep to about {{word_count}} words and write in a plain, concrete voice.
diagram:
  nodes:
    - { id: user, kind: io, label: Brief, description: "The blog-post brief that starts the chain, such as 'Write a post on index tuning for Postgres'." }
    - { id: llm1, kind: llm, label: Outline, description: "First call: turns the brief into a 4-6 section outline, returned as JSON with a heading and point per section." }
    - { id: gate, kind: guard, label: Check, model: false, description: "Plain code, not a model: checks the outline JSON parses and has the required sections before any drafting." }
    - { id: llm2, kind: llm, label: Draft, description: "Second call: writes the full post from the approved outline alone, keeping its sections and order." }
    - { id: llm3, kind: llm, label: Polish, description: "Third call: polishes the draft for tone and clarity and returns the finished post." }
    - { id: out, kind: io, label: Post, description: "The finished post, or an early exit with the rejected outline when the check fails." }
  edges:
    - { id: in, from: user, to: llm1, description: "The brief is filled into the outline prompt and sent to the first call.", example: "You are planning a blog post for backend engineers. <brief>Write a post on index tuning for Postgres</brief>" }
    - { id: to-gate, from: llm1, to: gate, description: "The outline JSON goes to the code check instead of straight to the next call.", example: "{\"sections\": [{\"heading\": \"Why indexes matter\", \"point\": \"Avoid full scans.\"}, {\"heading\": \"Reading EXPLAIN\", \"point\": \"Find the scan.\"}, {\"heading\": \"Composite indexes\", \"point\": \"Order matters.\"}, {\"heading\": \"Measuring\", \"point\": \"Compare timings.\"}]}" }
    - { id: pass, from: gate, to: llm2, description: "A valid outline continues down the chain to the draft step.", example: "Write the full post from this approved outline: {\"sections\": [{\"heading\": \"Why indexes\", \"point\": \"Avoid scans.\"}, {\"heading\": \"EXPLAIN\", \"point\": \"Find the scan.\"}, {\"heading\": \"Composite\", \"point\": \"Order matters.\"}, {\"heading\": \"Measuring\", \"point\": \"Compare timings.\"}]}" }
    - { id: fail, from: gate, to: out, style: dashed, label: exit, description: "An outline that fails the check ends the chain early, so no tokens are spent drafting from it.", example: "{\"error\": \"outline failed checks\", \"outline\": {\"sections\": [{\"heading\": \"Intro\", \"point\": \"...\"}, {\"heading\": \"Tips\", \"point\": \"...\"}]}}" }
    - { id: to-polish, from: llm2, to: llm3, description: "The full draft passes to the last call for a polish pass.", example: "Index tuning starts with measurement. Run EXPLAIN ANALYZE on the slow query and look for a Seq Scan on a large table..." }
    - { id: done, from: llm3, to: out, description: "The polished post leaves the chain as its final output.", example: "Index Tuning in Postgres: Measure First. Start with EXPLAIN ANALYZE on the slow query and look for sequential scans on large tables..." }
  scenarios:
    - id: passes
      label: '"Write a post on index tuning"'
      steps:
        - { id: arrive, caption: A brief for a blog post enters the first prompt., duration: 1000, events: [{ type: send, edge: in, token: { kind: prompt, label: brief } }] }
        - id: outline
          caption: The first call turns the brief into an outline, which goes to a code check.
          duration: 1600
          events:
            - { type: activate, node: llm1, status: thinking, at: [0, 0.6] }
            - { type: send, edge: to-gate, token: { kind: result, label: outline }, at: [0.6, 1] }
        - id: gate
          caption: Plain code confirms the outline has the required sections, so the chain continues.
          duration: 1400
          events:
            - { type: activate, node: gate, status: thinking, at: [0, 0.4] }
            - { type: branch, node: gate, taken: pass, notTaken: [fail], at: [0.4, 0.6] }
            - { type: send, edge: pass, token: { kind: result, label: ok }, at: [0.6, 1] }
        - id: draft
          caption: The second call writes the draft from the outline alone.
          duration: 1800
          events:
            - { type: activate, node: llm2, status: thinking, at: [0, 0.65] }
            - { type: send, edge: to-polish, token: { kind: result, label: draft }, at: [0.65, 1] }
        - id: polish
          caption: The third call polishes the draft and the finished post comes out.
          duration: 1800
          events:
            - { type: activate, node: llm3, status: thinking, at: [0, 0.6] }
            - { type: send, edge: done, token: { kind: result, label: post }, at: [0.6, 1] }
    - id: gate-fails
      label: '"Outline is missing sections"'
      steps:
        - { id: arrive, caption: A vague brief enters the first prompt., duration: 1000, events: [{ type: send, edge: in, token: { kind: prompt, label: brief } }] }
        - id: outline
          caption: The first call returns an outline with only two sections.
          duration: 1600
          events:
            - { type: activate, node: llm1, status: thinking, at: [0, 0.6] }
            - { type: send, edge: to-gate, token: { kind: result, label: outline }, at: [0.6, 1] }
        - id: gate
          caption: The code check fails, so the chain exits early instead of drafting from a bad outline.
          duration: 1600
          events:
            - { type: activate, node: gate, status: error, at: [0, 0.4] }
            - { type: branch, node: gate, taken: fail, notTaken: [pass], at: [0.4, 0.6] }
            - { type: send, edge: fail, token: { kind: feedback, label: rejected }, at: [0.6, 1] }
